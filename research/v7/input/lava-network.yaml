researchNotes:
  entityBoundaryUncertainty: >-
    Treated as one network entity per the frozen universe assignment. A
    distinct company-level seed round (Feb 2024) and a Lava Foundation
    token round (May 2024, not separately sourced in this packet) both
    exist in public reporting; this packet cites only the well-corroborated
    Feb 2024 seed round and the mainnet/governance events.
  sourceOriginUncertainty: >-
    IMPORTANT: two unrelated "Lava"-named projects surfaced during
    research and are explicitly NOT this entity. (1) "Lava Lending," a
    different protocol that suffered a flash-loan exploit in March 2024.
    (2) A "Lava Financial" / "Lava Ltd." smart-contract audit referenced by
    a third-party audit-listing site (Cyberscope) and a "docs.lavadefi.io"
    URL that does not resolve (DNS failure) as of 2026-09-11 -- this audit
    could not be verified as belonging to Lava Network at all and is
    excluded from this packet. No exploit or audit evidence from either
    unrelated project is attributed to Lava Network (lavanet.xyz / Lava
    Foundation / MagmaDevs) here.
  likelyContradictions: null
  completenessNotes: >-
    Evidence density MODERATE per the frozen cohort assignment. This QA
    pass added the Lava Foundation's May 2024 $11M token round, the
    MagmaDevs/Lava Protocol Inc. legal-entity name, a governance-control
    fact (Foundation as sole controller of token sales/roadmap pending a
    DAO transition), and an explicitly-caveated self-reported RPC-volume
    claim. Adoption metrics remain a gap: no source with clear
    value/period/asOf basis was found, and secondary aggregator figures
    (e.g., "40 million monthly active users") were excluded as evidence
    rather than included with weak provenance.
researchCutoff: "2026-09-10"
