entityStructure:
  relationships:
    - description: >-
        MagmaDevs (formerly named Lava Protocol Inc.) is the core
        development company behind Lava Network; the Lava Foundation is a
        separately described nonprofit-style entity, introduced publicly
        in May 2024, that sells LAVA tokens and, per contemporaneous
        reporting, was "the sole entity that sells tokens and decides the
        roadmap for the network until the DAO is live at mainnet."
      relatedEntityId: null
      relationType: foundation_of_network
  protocolNetworkRelationship: >-
    MagmaDevs / Lava Protocol Inc. (core development company, led by CEO
    Yair Cleper) built the Lava protocol; the Lava Foundation issues the
    LAVA token and directed the roadmap pre-DAO; the live network is a
    Cosmos-SDK-based chain whose LAVA token both incentivizes RPC providers
    and governs the network through on-chain proposals.
  unresolvedBoundaryNotes:
    - >-
      "MagmaDevs (formerly Lava Protocol Inc.)" is named as the core
      development company by The Block, but no source established its
      incorporation jurisdiction, nor the exact legal relationship between
      MagmaDevs and the Lava Foundation (e.g., common ownership, contractual
      services agreement, or something else).
    - >-
      Public sources did not establish the degree to which network control
      has actually decentralized away from the core team/Foundation since
      mainnet, versus remaining a stated future intent (a DAO "at mainnet"
      per the May 2024 report).
