unknowns:
  - id: gap-eoracle-founders-entity
    whatWasSearched: "eOracle's legal entity name, jurisdiction, headquarters, and founder/team identity"
    whatCouldNotBeEstablished: >-
      Secondary aggregator sources (a VC portfolio page, a startup database)
      suggest a company "Lightblocks Labs" (Tel Aviv) and a co-founder named
      Matan Sitbon, but no source carrying an established availabilityDate
      independently corroborated this within the research budget for this
      batch; several candidate sources returned access errors.
    expectedToMatter: true
  - id: gap-eoracle-legion-token-sale-status
    whatWasSearched: "Whether eOracle's planned ~$5M Legion public token sale (originally targeted for February 10-12, 2025) actually executed, was postponed, and on what final terms"
    whatCouldNotBeEstablished: >-
      Aggregator/tracker sources conflict: one search result described the
      Legion sale as postponed due to poor market conditions, while an
      ICO-tracking site (icodrops) still listed the round and the EO Token
      Generation Event as "Upcoming" with no confirmed date as of its last
      update, and a separate price-tracking aggregator appears to carry a
      live EO price. No dated primary or independent-journalism source
      resolving this conflict was found within the research budget for this
      batch, so no EvidenceClaim is made about the sale's outcome.
    expectedToMatter: true
  - id: gap-eoracle-eo-chain-mainnet-status
    whatWasSearched: >-
      Current status of the separate "EO chain" (Phase 2) mainnet referenced
      in eOracle's own April 2024 announcement and in the frozen universe
      contract's "planned EO chain mainnet" characterization
    whatCouldNotBeEstablished: >-
      No dated source confirming an "EO chain" mainnet launch (as distinct
      from the live EigenLayer restaking/staking layer) was found as of the
      research cutoff.
    expectedToMatter: true
  - id: gap-eoracle-financing-history
    whatWasSearched: "eOracle's/Lightblocks Labs's pre-seed and seed financing amounts, dates, and investors"
    whatCouldNotBeEstablished: >-
      No source carrying an established availabilityDate independently
      corroborated a specific financing round amount, date, or investor list
      within the research budget for this batch.
    expectedToMatter: true
  - id: gap-eoracle-site-content-change
    whatWasSearched: "Whether eo.app / eo.tech's current 'compute verification' site content reflects an actual business pivot"
    whatCouldNotBeEstablished: >-
      eo.app now redirects to eo.tech, whose current content (accessed
      2026-09-11) describes an unrelated compute-verification product; no
      dated announcement explaining this change was found, so it is recorded
      only as an unresolved observation and not asserted as fact.
    expectedToMatter: true
researchNotes:
  entityBoundaryUncertainty: >-
    eOracle is treated as the network/protocol entity per the frozen
    universe assignment (entityType: network). Secondary sources associate a
    company "Lightblocks Labs" as the building team, but this could not be
    independently corroborated within this research pass (see
    gap-eoracle-founders-entity).
  sourceOriginUncertainty: >-
    Most operational facts in this packet rest on eOracle's own blog
    (official_network_source, non-independent); The Block's April 2024
    coverage of the EigenLayer AVS cohort is the only independent-journalism
    corroboration found, and it covers only the mainnet-launch fact, not the
    audit or integration claims.
  likelyContradictions: >-
    Aggregator/tracker sources disagree on the status of the Legion public
    token sale and EO token launch: one search result described the sale as
    postponed, while icodrops still listed the round and TGE as "Upcoming"
    with no confirmed date, and a separate price-tracking aggregator appears
    to track a live EO price. This packet does not resolve the conflict and
    makes no EvidenceClaim about the sale's outcome (see
    gap-eoracle-legion-token-sale-status).
  completenessNotes: >-
    Evidence density is THIN per the frozen cohort assignment. Research
    established the EigenLayer AVS mainnet launch, a security-audit
    disclosure, and one concrete DeFi integration (Silo), each from a dated
    source. Team/company identity, full financing history, the Legion token
    sale's actual outcome, and the separate "EO chain" mainnet status could
    not responsibly be established within the research budget for this batch
    and are recorded as gaps rather than asserted.
