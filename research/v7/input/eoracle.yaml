entityStructure:
  relationships: []
  protocolNetworkRelationship: >-
    eOracle is an Ethereum-native oracle network secured via EigenLayer
    restaking (validators/operators stake and are slashable for incorrect
    data). Secondary aggregator sources (a venture-capital portfolio page and
    a startup database) associate an entity called "Lightblocks Labs"
    (reportedly Tel Aviv-based) as the team building eOracle and name Matan
    Sitbon as co-founder/CEO, but these could not be independently
    corroborated from a source carrying an established availabilityDate
    within this research pass, so no EvidenceClaim is made about company
    identity or founders.
  unresolvedBoundaryNotes:
    - >-
      No public source independently confirmed a registered legal-entity
      name, jurisdiction, or headquarters for the team operating eOracle
      within this research pass.
    - >-
      eo.app now 301-redirects to eo.tech, whose current site content
      (accessed 2026-09-11) describes a "verification and intelligence layer
      for deployed compute" unrelated to oracle/blockchain price-feed data.
      Whether this reflects an actual business pivot by the eOracle team, a
      different entity holding the domain, or an in-progress redesign could
      not be established, and no EvidenceClaim is made about it; it is
      recorded only as an unresolved observation.
