  relationships:
    - description: >-
        Huma Finance merged with Swiss transaction-services and cross-border
        liquidity company Arf in April 2024; public materials continued to use
        both brands after the merger.
      relatedEntityId: null
      relationType: merged_operating_company
    - description: >-
        The Huma Foundation described itself as the issuer/steward of the HUMA
        utility and governance token, while Huma Finance and Arf operate the
        payment-financing products.
      relatedEntityId: null
      relationType: foundation_protocol_steward
  protocolNetworkRelationship: >-
    The packet treats Huma Finance, its Huma protocol, and the HUMA-governed
    PayFi network as one hybrid entity under the frozen assignment, while
    distinguishing company financing, protocol liquidity, and token economics.
