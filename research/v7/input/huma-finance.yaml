description: >-
  Huma Finance is a payment-financing (PayFi) protocol and operating company
  that connects stablecoin liquidity to real-world payment receivables and
  settlement flows. It offers permissionless Solana pools and a separate
  permissioned institutional product, and the HUMA token governs and
  incentivizes the protocol.
