researchNotes:
  entityBoundaryUncertainty: >-
    Term Finance protocol, Term Labs/developer entity, any token issuer, and
    integration partners are separate roles; public sources do not fully map
    control or economics.
  sourceOriginUncertainty: >-
    Most protocol, integration, and security-scope information is first-party.
    Chain Broker is independent structured-secondary data but low-confidence
    for financing until primary evidence is found.
  likelyContradictions: null
  completenessNotes: >-
    Packet establishes product design, partial security/formal-verification
    scope, one institutional/RWA credit integration, and low-confidence
    financing data. It leaves usage, token economics, legal entity, and
    borrower/lender concentration unresolved.
