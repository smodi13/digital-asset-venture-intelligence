description: >-
  Candide is an open-source account-abstraction (ERC-4337 / EIP-7702)
  infrastructure provider. Its main components are Voltaire, a Python/Rust
  ERC-4337 bundler, and AbstractionKit, a TypeScript SDK for building and
  sending UserOperations with first-class support for Safe smart accounts,
  alongside a Safe-based smart contract wallet and a social-recovery module.
