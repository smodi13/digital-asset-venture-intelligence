researchNotes:
  entityBoundaryUncertainty: >-
    "Candide" / "Candide Labs" / GitHub org "candidelabs" are used
    interchangeably in public sources with no confirmed formal legal-entity
    name, consistent with the frozen THIN evidence-density label.
  sourceOriginUncertainty: >-
    All company-authored sources (AbstractionKit V2 blog, Voltaire blog) are
    a single company voice; the Optimism grant proposal and the Ackee audit
    are each independent of Candide and of each other.
  likelyContradictions: null
  completenessNotes: >-
    Consistent with the frozen THIN evidence-density label: product identity
    (Voltaire bundler, AbstractionKit SDK, Safe integration), one ecosystem
    grant (Optimism, 2022), and one independent security audit finding
    (Ackee Blockchain, 2024, of a module Candide implemented) are
    established. Founder identity, legal entity/jurisdiction, private
    financing, and adoption/usage metrics could not responsibly be
    established within the research budget for this batch and are recorded
    as gaps. GitHub repository star/fork/commit counts were reviewed but
    deliberately excluded as an EvidenceClaim per the forbidden-automatic-
    positive rule (repo_popularity, github_stars) and because they reflect a
    live, continuously updating state rather than a dated, citable fact.
