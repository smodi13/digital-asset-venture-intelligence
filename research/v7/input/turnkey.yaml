description: >-
  Turnkey provides non-custodial wallet infrastructure and open-source SDKs
  for developers to embed crypto wallets and automate on-chain transaction
  signing. Its core architecture uses AWS Nitro Enclave-based Trusted
  Execution Environments (TEEs) and an open-source "QuorumOS" secure-computing
  layer to keep private keys inaccessible outside the enclave, with
  cryptographic attestations intended to make the system's behavior
  independently verifiable rather than trusted blindly.
