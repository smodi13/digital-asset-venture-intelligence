      Whether the Centrifuge Network Foundation holds equity in Anemoy, or
      whether CFG token holders have any indirect economic claim on
      Anemoy's revenue, is explicitly posed as an open, unanswered question
      in a Centrifuge governance-forum thread from August 2026 (see
      signalEvents and evidenceClaims).
