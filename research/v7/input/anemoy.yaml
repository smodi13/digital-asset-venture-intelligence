      Janus Henderson announced (September 13, 2024) a partnership with
      Anemoy and Centrifuge to launch the Janus Henderson Anemoy Liquid
      Treasury Fund (later branded JTRSY), a fully on-chain tokenized fund
      providing investors direct access to short-term U.S. Treasury bills;
      Anemoy, founded 2023 by Martin Quensel (also a Centrifuge co-founder)
      and Anil Sood, is described as functioning as an asset-management
      vehicle advancing Centrifuge's RWA product efforts and manages the
      fund's on-chain origination, tokenization, and distribution lifecycle,
