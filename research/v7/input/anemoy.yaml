      relatedEntityId: null
      relationType: shared_founder_and_protocol_dependency
  protocolNetworkRelationship: >-
    Anemoy is a company/asset-manager entity (a third-party aggregator
    profile names it "Anemoy Capital SPC Limited") that issues tokenized
    funds using the Centrifuge protocol as its tokenization/blockchain
    infrastructure layer; it is not itself the Centrifuge protocol or
    network. A Centrifuge governance-forum thread active shortly before the
    research cutoff shows this company/protocol boundary, and specifically
    whether CFG (Centrifuge's token) holders have any economic claim on
    Anemoy, as an open and explicitly unresolved question among Centrifuge
    community members.
  unresolvedBoundaryNotes:
