researchNotes:
  entityBoundaryUncertainty: >-
    Anemoy operates as a company/asset-manager entity distinct from the
    Centrifuge protocol/network, but shares a co-founder (Martin Quensel)
    with Centrifuge and is described by both Centrifuge and Janus Henderson
    as advancing Centrifuge's own RWA product roadmap; the frozen universe
    assignment records entityType as protocol, which this packet follows,
    while flagging the company/protocol boundary and the unresolved
    CFG-value-capture question as open uncertainty.
  sourceOriginUncertainty: >-
    Identity/product facts are corroborated via Janus Henderson's own
    investor-relations channel (independent of Anemoy/Centrifuge) and
    independent journalism (crypto.news); the legal-entity name/HQ rests on
    a single aggregator source; the governance/value-capture question rests
    on a single, non-independent (community/participant) governance-forum
    source, recorded at reduced confidence accordingly.
  likelyContradictions: null
  completenessNotes: >-
    Consistent with the frozen THIN evidence-density label: the two
    flagship tokenized-fund products (JTRSY, ACRDX) and founder identity
    are reasonably well established via independent/IR sources; company-
    level legal entity, financing history, and the CFG/Anemoy
    value-capture relationship could not responsibly be established within
    the research budget for this batch and are recorded as gaps, including
    one genuine, dated negative/conflicting-evidence item (the unresolved
    governance-forum question about CFG holders' economic claim on
    Anemoy) found via deliberate search per the negative-evidence research
    standard.
