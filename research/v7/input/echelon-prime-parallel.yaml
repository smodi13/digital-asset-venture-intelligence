researchNotes:
  entityBoundaryUncertainty: >-
    Treated as one combined hybrid entity ("Echelon Prime (Parallel)") per
    the frozen universe assignment, spanning the equity-funded development
    studio (Parallel Studios) and the token-issuing non-profit (Echelon
    Prime Foundation, governed by the elected Emissaries Prime body). See
    unresolvedBoundaryNotes for what remains unclear about their exact
    legal relationship.
  sourceOriginUncertainty: >-
    The Vikara Capital deep dive (2025-03-26) is the sole source for
    founder names/roles and the Emissaries Prime governance structure;
    treated as one origin/voice for those specific facts, not independently
    corroborated. The GAMES.GG outlet published two distinct articles used
    here (Mar 2024 funding, Jun 2025 roadmap), treated as two separate
    facts from the same publisher, not duplicated evidence.
  likelyContradictions: >-
    The reported "Core NFT cacher emissions pause / smart-contract
    vulnerability" event carries internally conflicting dates across
    secondary/AI-summarized sources (July 2024 vs. May 2026) and could not
    be resolved to a primary source within the research budget; it is
    recorded only as an unresolved gap (gap-echelon-emissions-pause-rumor),
    not as a claim or signal.
  completenessNotes: >-
    Evidence density RICH per the frozen cohort assignment; this batch
    confirmed multiple independent-journalism sources across identity,
    capital (three distinct fundraising/token events: 2021 Series A, 2024
    Series B, 2023 PRIME TGE), governance, and product/roadmap dimensions,
    plus one first-party-only 2026 product-partnership lead closer to the
    research cutoff (resolving the universe-stage gap "no confirmed public
    update closer to the 2026 cutoff"). Adoption/usage metrics, current
    token market data, and the emissions-pause security lead remain open
    gaps despite the RICH label; audit scope is effectively unverified.
