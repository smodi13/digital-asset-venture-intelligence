  - id: gap-echelon-token-market-data
    whatWasSearched: >-
      Current PRIME circulating market cap / FDV / price as of a date near
      the 2026-09-10 cutoff, with clear methodology
    whatCouldNotBeEstablished: >-
      Token-price/market-cap commentary is explicitly excluded as final
