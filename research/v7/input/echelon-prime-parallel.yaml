    expectedToMatter: true
  - id: gap-echelon-emissions-pause-rumor
    whatWasSearched: >-
      A reported Echelon Foundation pause of emissions for "The Core" NFT
      cachers due to a smart-contract vulnerability in a Quantstamp-audited
      caching contract
    whatCouldNotBeEstablished: >-
      Search-engine AI-generated summaries referenced this event but gave
      internally conflicting dates (one summary cited July 16, 2024; another
      cited May 11, 2026) and no directly fetchable primary source (official
      blog post, dated tweet, or independent security-incident report) could
      be opened and verified within the research budget. Per this batch's
      source-quality rules (no AI-generated summaries as final evidence),
      this was deliberately NOT converted into an EvidenceClaim or
      SignalEvent. Flagged here as an unresolved, potentially material
      security-incident lead requiring direct primary-source verification.
    expectedToMatter: true
  - id: gap-echelon-adoption-metrics
    whatWasSearched: >-
      Player counts, daily/monthly active users, retention, and card
      sales/marketplace volume with clear methodology and asOf date
    whatCouldNotBeEstablished: >-
      No source with a clear, independently verifiable value/period/asOf
