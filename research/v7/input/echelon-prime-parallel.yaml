entityStructure:
  relationships:
    - description: >-
        Parallel Studios is the for-profit development studio that built the
        Parallel TCG game. Echelon Prime Foundation is a separately
        described non-profit entity that issues the PRIME token and
        oversees the broader Echelon ecosystem (Parallel TCG, plus
        announced companion titles Colony and Sanctuary). Emissaries Prime
        (EP) is described as the governing body that stewards the
        Foundation, functioning similarly to a corporate board; its first
        11 members were elected in February 2022.
      relatedEntityId: null
      relationType: foundation_of_network
  protocolNetworkRelationship: >-
    Parallel Studios (equity-funded, raised a $50M Series A from Paradigm in
    Oct 2021 and a $35M Series B in Mar 2024) builds the Parallel TCG game
    client; the Echelon Prime Foundation issues the PRIME token, runs
    community/ecosystem programs (esports league, Prime Pass, NFT
    "cachers"/staking), and is governed by the elected Emissaries Prime
    body. The universe/cohort assignment treats studio and foundation as
    one combined entity ("Echelon Prime (Parallel)").
  unresolvedBoundaryNotes:
    - >-
      No source found within the research budget establishes the precise
      legal/contractual relationship between Parallel Studios (the equity
      entity) and the Echelon Prime Foundation (the token-issuing entity):
      e.g., common ownership, services agreement, or fully independent
      non-profit status.
    - >-
      Incorporation jurisdiction for both Parallel Studios and Echelon Prime
      Foundation is not established; sources place the team/operations in
      Toronto, Canada, but do not state formal incorporation domicile.
