  Echelon Prime is the Toronto-based studio/foundation ecosystem behind
  Parallel, a sci-fi NFT trading card game (built on Ethereum, in open beta
  on Epic Games Store) with an associated PRIME governance token, a
  foundation-run governance body (Emissaries Prime), and a competitive
  esports league (Parallel Prime League).
