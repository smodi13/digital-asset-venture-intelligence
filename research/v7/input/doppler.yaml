description: >-
  Doppler is an onchain token-issuance, price-discovery, and liquidity-
  bootstrapping protocol developed by Whetstone Research. Its contracts and
  SDK let applications configure auctions, token supply, vesting, governance,
  fees, and migration into generalized automated markets.
