researchNotes:
  entityBoundaryUncertainty: >-
    Fuel Labs (company), the Fuel protocol/FuelVM, and Fuel Ignition
    (network) are treated as one hybrid entity per the frozen universe
    assignment; a Fuel Security Council multisig exercises governance
    control over bridge contracts and is functionally distinct from Fuel
    Labs the company, but no source clearly separates the two as legal
    entities.
  sourceOriginUncertainty: null
  likelyContradictions: >-
    Aggregator/tracker sites (CryptoRank) report cumulative funding of
    $90.9M across 7 rounds versus the single well-corroborated $80M round
    reported by The Block in 2022; this packet cites only the corroborated
    figure and flags the discrepancy rather than resolving it.
  completenessNotes: >-
    Evidence density for this candidate is MODERATE per the frozen cohort
    assignment. Research here prioritized financing, mainnet launch, token
    launch, and the most material governance/risk finding (Security Council
    reduction and undisclosed bridge pause) over exhaustive adoption-metric
    collection.
