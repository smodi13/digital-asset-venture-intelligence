description: >-
  Fuel is a modular execution-layer rollup network (branded "Fuel Ignition"
  on mainnet) built around a custom parallelized virtual machine (FuelVM) and
  the Sway smart-contract language, developed by Fuel Labs and governed
  on-chain by a Fuel Security Council multisig. The FUEL token secures and
  incentivizes the network alongside the equity of the developing company.
