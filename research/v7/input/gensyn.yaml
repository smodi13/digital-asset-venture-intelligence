researchNotes:
  entityBoundaryUncertainty: >-
    Gensyn's company, Foundation, issuer, protocol, network, applications and
    token are linked but not interchangeable. Public inter-entity agreements
    and full control rights were not established.
  sourceOriginUncertainty: >-
    Funding and technical architecture have substantial issuer/investor origin.
    The Block and Lookonchain add independent reporting for specified events,
    while Hypernative is a vendor disclosure and cannot self-corroborate.
  likelyContradictions: >-
    Public-sale gross commitments of approximately $16.14 million and reported
    net proceeds of $11.7 million describe different bases after refunds, not
    competing totals. They are preserved distinctly rather than reconciled.
  completenessNotes: >-
    Mainnet, token and product launches are documented, but production compute
    demand, company revenue, governance control and fully scoped public audit
    evidence remain unresolved.
