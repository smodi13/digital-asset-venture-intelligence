nameAliasNote: >-
  The packet uses Gensyn as the umbrella project name while separating Gensyn
  Limited, Gensyn Foundation, Gensyn Network Ltd, the Gensyn Network and the AI
  token where the sources distinguish them.
entityTypeCorrectionNote: null
assetTypeCorrectionNote: >-
  The frozen cohort lists assetType unknown. By the cutoff, Gensyn Limited had
  disclosed venture financing and the Gensyn Foundation/Network had completed
  a public AI-token sale and launched the token. The investable exposure is
  therefore recorded as equity_and_token, without treating the instruments as
  economically interchangeable.
entityStructure:
  relationships:
    - description: >-
        Gensyn Limited is the UK development company that initially developed
        the protocol and received venture financing.
      relatedEntityId: null
      relationType: protocol_development_company
    - description: >-
        Gensyn Network Ltd, a subsidiary of the Cayman Islands Gensyn
        Foundation, is identified as issuer of the AI utility token and works
        with the Foundation on protocol treasury management.
      relatedEntityId: null
      relationType: token_issuer_and_foundation_subsidiary
    - description: >-
        The Gensyn Network is the Ethereum-rollup network on which Delphi and
        other machine-learning coordination applications operate.
      relatedEntityId: null
      relationType: affiliated_network
  protocolNetworkRelationship: >-
    The development company, Foundation, token issuer, protocol and rollup
    network are related but distinct. Venture capital at Gensyn Limited, token
    sale proceeds, network transaction activity and application fees are not
    collapsed into one company-level capital or revenue figure.
  unresolvedBoundaryNotes:
    - >-
      Public sources did not establish the complete ownership, service and IP
      agreements among Gensyn Limited, Gensyn Foundation, Gensyn Network Ltd
      and any U.S. entity referenced in web terms.
