researchNotes:
  entityBoundaryUncertainty: >-
    Agora, Agora Bermuda Limited, the AUSD token contracts, and reserve/custody
    arrangements are economically linked but not interchangeable legal
    entities.
  sourceOriginUncertainty: >-
    The seed PR and Sui Chainwire item are company-originated; The Block and
    Fortune are independent journalism but still rely partly on company and
    investor disclosures for private financing details.
  likelyContradictions: null
  completenessNotes: >-
    Packet establishes founders, seed and Series A financing, AUSD product
    positioning, reserve-manager/custodian claims, and a dated Sui deployment.
    It does not independently prove reserve sufficiency, customer retention,
    audited contract security, or full legal control.
