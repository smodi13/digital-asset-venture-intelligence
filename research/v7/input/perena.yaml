description: >-
  Perena is a Solana-based stablecoin liquidity and structured-credit
  protocol. Its core product, Numeraire, is an automated market maker
  pooling multiple stablecoins (initially Tether, Circle USDC, and PayPal
  USD) into a hub-and-spoke pool, issuing a liquidity-provider token (USD*)
  representing a share of tranched yield across the pool.
