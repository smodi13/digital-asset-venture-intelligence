researchNotes:
  entityBoundaryUncertainty: >-
    Aethir Ltd., Aethir network, ATH contracts, DCI Foundation, node operators,
    and compute purchasers have different legal/economic roles. The packet
    preserves that uncertainty rather than collapsing them.
  sourceOriginUncertainty: >-
    Most scale and revenue evidence is first-party. The SEC filing is
    independent legal disclosure from a treasury holder but does not verify
    Aethir's own revenue or complete governance.
  likelyContradictions: >-
    Public materials use different titles for Mark Rydon and Daniel Wang over
