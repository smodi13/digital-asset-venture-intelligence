researchNotes:
  entityBoundaryUncertainty: >-
    Fren Pet's public footprint centers on creators and contracts rather than a
    disclosed legal entity. Protocol, Base network, FP token, pet NFTs and
    pGOLD are preserved as distinct concepts.
  sourceOriginUncertainty: >-
    The current mechanics are primarily first-party documentation. Independent
    2023 reviews establish early product and activity context but not the full
    later V2 state.
  likelyContradictions: >-
    A 5% 2023 trading-fee schedule and a later 4% documented schedule differ.
    Because the observations are at different times and the contract permits
    fee updates, the packet treats this as a parameter change, not a silently
    resolved same-date conflict.
  completenessNotes: >-
    The packet documents launch, architecture, token mechanics, fees, creators,
    early activity and an operational limitation. Legal identity, financing,
    current adoption, realized economics and V2 audit evidence remain gaps.
researchCutoff: "2026-09-10"
