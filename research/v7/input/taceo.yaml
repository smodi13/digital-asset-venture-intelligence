researchNotes:
  entityBoundaryUncertainty: >-
    TACEO is a single operating company per the frozen universe assignment
    (entityType: company, assetType: equity); the "TACEO Network" is treated
    as a company product/service, not a separate protocol or token-bearing
    entity, consistent with no token or network-token evidence being found.
  sourceOriginUncertainty: >-
    The seed round is independently corroborated by Tech.eu and TACEO's own
    announcement (same figures, no conflict). The network launch and World
    ID user-scale figures rely primarily on TheNextWeb and Tech.eu, both
    independent journalism, though the underlying user-count figures
    originate from company disclosure repeated by each outlet rather than
    being independently audited.
  likelyContradictions: null
  completenessNotes: >-
    Evidence density is MODERATE per the frozen cohort assignment. Research
    established the founding team, the July 2025 seed round, the World ID
    partnership and its reported user-scale at two points in time, and the
    March 2026 TACEO Network launch with named node operators. Legal-entity
    detail, independent security audit status, revenue/business model, and
    full node-operator count could not responsibly be established within the
    research budget for this batch and are recorded as gaps.
