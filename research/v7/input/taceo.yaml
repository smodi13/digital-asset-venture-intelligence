description: >-
  TACEO is an Austrian cryptography company building "Private Shared State"
  infrastructure using coSNARKs, a technique combining multiparty computation
  (MPC) and zero-knowledge proofs (ZK), so multiple parties can jointly
  compute on and prove facts about encrypted data without any party seeing
  the underlying inputs.
