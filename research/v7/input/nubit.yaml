description: >-
  Nubit is a Bitcoin-native data availability protocol developed by Riema
  Labs Inc., originally positioned as infrastructure that lets
  Bitcoin-ecosystem applications (BRC-20-style indexers, rollups, modular
  services) post and verify data with Bitcoin-level security assumptions.
  Since March 2025 Nubit has repositioned around "Bitcoin Thunderbolt," a
  proposed Bitcoin base-layer soft-fork upgrade Nubit says it co-developed,
  aimed at faster transactions and native programmability.
