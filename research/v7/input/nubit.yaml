    modelEligibility: context_only
    topic: product
    notes: >-
      This is a company self-disclosure of a strategic/product pivot; the
      technical claims about a Bitcoin soft-fork (a change that would
      require Bitcoin Core consensus, not something any single company can
      unilaterally ship) are Nubit's own characterization and were not
      independently verified against Bitcoin Core proposal channels within
      the research budget for this batch. A later sponsored press item
      (news.bitcoin.com, June 25, 2025) claimed Thunderbolt had facilitated
      "over 4 million transactions" and "267,000 unique users," but that
      figure is (a) sponsored/company-adjacent content, not independent
      reporting, and (b) attributed to the broader Thunderbolt initiative,
      not specifically to Nubit; it is deliberately excluded from this
      packet's evidence rather than recorded as an adoption metric.
