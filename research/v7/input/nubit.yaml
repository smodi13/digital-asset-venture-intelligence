unknowns:
  - id: gap-nubit-independent-corroboration
    whatWasSearched: "Independent (non-company-controlled, non-wire-reproduction) journalism confirming Nubit's funding rounds"
    whatCouldNotBeEstablished: >-
      Every source found for both funding rounds traces back to Nubit's own
      Medium announcements or a wire reproduction of the same; no
      independent financial or crypto-native journalism outlet was found to
      have independently reported or verified these rounds.
    expectedToMatter: true
  - id: gap-nubit-mainnet-status
    whatWasSearched: "Nubit mainnet launch date or current network status as of the research cutoff"
    whatCouldNotBeEstablished: >-
      Public sources describe a pre-alpha and alpha testnet (2024) but no
      source within the research budget established a mainnet launch date
      or confirmed the network remained in testnet as of 2026-09-10.
    expectedToMatter: true
  - id: gap-nubit-token
    whatWasSearched: "Whether a NUBIT-style token has launched, its structure, and any exchange listing"
    whatCouldNotBeEstablished: "No confirmed token launch was established; assetType recorded as unknown."
    expectedToMatter: true
  - id: gap-nubit-governance-control
    whatWasSearched: "Governance model, admin keys, multisig/control structure for Nubit infrastructure"
    whatCouldNotBeEstablished: "No source addressed governance or control structure."
    expectedToMatter: true
  - id: gap-nubit-aggregate-funding-figure
    whatWasSearched: >-
      A "$12 million total funding" figure attributed to Nubit (via a
      Polychain-affiliated social post and secondary financial-media
      pickups referencing it)
    whatCouldNotBeEstablished: >-
      The $3M pre-seed and $8M seed rounds already in this packet sum to
      $11M, not $12M; the secondary articles repeating "$12M" were either
      unreachable (403/404) or themselves traced back to the same
      company-affiliated announcement within the research budget for this
      batch. Not recorded as evidence; the reconciled $11M ($3M + $8M) is
      what this packet actually supports.
    expectedToMatter: false
  - id: gap-nubit-legal-entity
    whatWasSearched: "Legal entity name, jurisdiction, headquarters"
    whatCouldNotBeEstablished: >-
      Press materials name "Riema Labs Inc." at an address in George Town,
      Grand Cayman, Cayman Islands, but this was not independently
      corroborated by a registry or non-company source.
    expectedToMatter: false
researchNotes:
  entityBoundaryUncertainty: >-
    Riema Labs Inc. and "Nubit" are used interchangeably across the
    company's own communications; this packet treats them as one entity per
    the frozen universe assignment (entityType protocol).
  sourceOriginUncertainty: >-
    Both funding-round claims rest entirely on company-controlled channels
    (official Medium) plus a wire reproduction of the same text; per source-
    independence rules, this is one voice, not two. Evidence density for
    this candidate is correctly THIN.
  likelyContradictions: null
  completenessNotes: >-
    Consistent with the frozen THIN evidence-density label, research here
    is limited to what could be established about identity, founders,
    capital, and the March 2025 Bitcoin Thunderbolt product/strategic
    pivot; adoption, mainnet status, token structure, and governance could
    not responsibly be established within the research budget for this
    batch and are recorded as gaps rather than estimated. This packet
    remains intentionally THIN: additional company-controlled press
    material was found (e.g., Goldinals launch, USD1 stablecoin
    integration claims, a sponsored "4 million transactions / 267,000
    users" figure) but was not added because it does not meaningfully
    change the independence/evidentiary picture (same voice) or could not
    be attributed specifically to Nubit rather than the broader Thunderbolt
    initiative.
researchCutoff: "2026-09-10"
