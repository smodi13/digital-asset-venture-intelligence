researchNotes:
  entityBoundaryUncertainty: >-
    Treated as one hybrid entity (operating studio/team plus the PIXEL
    token-governed in-game economy) per the frozen universe assignment. The
    "Pixels" brand previously operated as "Pixels.online" on Polygon before
    its September 2023 migration to Ronin; no separate legal entity is
    asserted for the two branding phases in the absence of contrary evidence.
  sourceOriginUncertainty: >-
    Several aggregator/exchange-calendar sites (Bitget, Binance Square,
    CryptoDiffer, Gate) reported the same $4.8 million strategic-round figure
    from February 2024; only one independent outlet with clear publication
    details (ChainCatcher) was opened and cited as the primary source for
    that claim, and these aggregator reproductions are treated as one voice,
    not separate corroboration.
  likelyContradictions: >-
    The company's self-reported "1 million daily active users" claim (May
    13, 2024) is in material tension with independent reporting two weeks
    later (May 27, 2024) estimating roughly 70% of Pixels-linked Ronin
    accounts as bots; both claims are retained with the conflict preserved
