researchNotes:
  entityBoundaryUncertainty: >-
    "Initia" refers interchangeably to the operating company (Initia Labs),
    the L1 network, and the INIT token; no separate foundation entity is
    established in sources reviewed, consistent with the frozen hybrid
    entityType / equity_and_token assetType assignment.
  sourceOriginUncertainty: >-
    The seed and Series A rounds are each independently corroborated by a
    single named-byline journalism outlet (TechCrunch, The Block
    respectively); no wire-service or press-release reproduction was relied
    upon for either figure. Mainnet/token-launch logistics rest on an
    exchange-academy explainer (Bitget) corroborated by independent
    post-launch market reporting (The Defiant).
  likelyContradictions: null
  completenessNotes: >-
    Consistent with the frozen MODERATE evidence-density label: founder
    identity, seed and Series A financing, and the mainnet/token launch
    event are well established via independent journalism; real post-launch
    usage/TVL across Minitia rollups, a security-audit record, and any
    financing subsequent to the Series A could not responsibly be
    established within the research budget for this batch and are recorded
    as gaps.
