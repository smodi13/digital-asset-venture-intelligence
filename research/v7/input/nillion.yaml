  - id: clm-nillion-ethereum-migration-2026
    schemaVersion: 7
    companyId: co-nillion
    claim: >-
      Nillion announced on January 27, 2026 that it is migrating its
      network architecture from a Cosmos-based chain ("nilChain") to
      Ethereum, rebranded "Nillion 2.0," redefining NIL from primarily a
      governance/staking token on its own chain to a token required for
      access, staking (including a stated 70,000 NIL requirement to
      operate a "Blacklight" verification node launching February 2, 2026),
      and peer-to-peer payments on Ethereum. Kraken's exchange support
      documentation (last updated February 27, 2026) independently
      confirmed the migration was underway, scheduling a Cosmos deposit/
      withdrawal pause (March 13, 2026) and a client migration window
      (March 16-20, 2026) with balances converted 1:1.
