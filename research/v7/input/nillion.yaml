researchNotes:
  entityBoundaryUncertainty: >-
    Treated as one hybrid entity per the frozen universe assignment; the
    operating company, the Nillion network/protocol, and the "Nillion
    Association" referenced in the November 2025 incident statement are
    not clearly separated in public sources.
  sourceOriginUncertainty: >-
    The mainnet/TGE launch is corroborated by an independent Messari report
    alongside the company's own Chainwire press release; the November 2025
    market-maker crash rests entirely on Nillion's own account as relayed
    by specialist outlets (Bitget News, Cryptopolitan, PANews), which is
    recorded here as one voice (company-reported, relayed) rather than
    independently confirmed.
  likelyContradictions: null
  completenessNotes: >-
    Evidence density RICH per the frozen cohort assignment, reflected here
    in richer coverage across capital, product/network milestones,
    tokenomics/concentration risk, a material negative governance/market
    event, and (added in this QA pass) the January 2026 Ethereum migration
    and associated token-utility redesign, independently corroborated as
    operationally real by an exchange (Kraken) rather than resting solely
    on Nillion's own framing. Several gaps (legal structure, network
    metrics, counterparty identity, full audit scope, Phase 0 upgrade
    detail, migration-completion confirmation) remain explicitly recorded
    rather than estimated.
