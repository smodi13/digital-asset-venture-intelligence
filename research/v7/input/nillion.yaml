description: >-
  Nillion is a "blind computation" privacy-infrastructure network (branded
  "Petnet"), combining multi-party computation (MPC) and other
  privacy-enhancing technologies to let applications process data without
  revealing its contents. Nillion launched its own Cosmos-based mainnet
  ("nilChain") in March 2025, then announced in January 2026 a migration
  to Ethereum ("Nillion 2.0"), redefining NIL's role around staking,
  node-operator access, and payments on Ethereum rather than governance of
  a standalone chain.
