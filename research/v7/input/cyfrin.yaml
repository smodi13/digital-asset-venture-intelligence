researchNotes:
  entityBoundaryUncertainty: null
  sourceOriginUncertainty: >-
    All identity, product, and client claims trace to Cyfrin's own website;
    the only genuinely independent corroboration found (GitHub org, Weekday
    profile, Tracxn) covers narrow facts (repository existence, one
    founder's identity, absence of a confirmed funding round), consistent
    with the frozen THIN evidence-density label.
  likelyContradictions: >-
    Cyfrin's own "About Us" page (as fetched for this packet) names
    different individuals in leadership roles than the independently
    corroborated Patrick Collins co-founder/CEO attribution found via
    GitHub and other public search results; this packet records only the
    corroborated founder fact and flags the unreconciled leadership
    roster as a gap rather than asserting a full team list.
  completenessNotes: >-
    Consistent with the frozen THIN evidence-density label: identity and
    product/tooling claims are reasonably well established from the
    company's own materials and GitHub organization, but financing, exact
    team composition, HQ verification, and audit track record are not
    independently corroborated and are recorded as gaps.
