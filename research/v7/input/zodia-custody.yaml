description: >-
  Zodia Custody is an FCA-registered institutional digital-asset custody,
  off-venue settlement (Interchange), and staking infrastructure provider,
  founded in 2020/2021 by SC Ventures (Standard Chartered's innovation arm)
  and Northern Trust, with Standard Chartered as majority shareholder. As of
  the research cutoff, Standard Chartered's non-binding offer to acquire the
  remainder of Zodia Custody's regulated custody business had been accepted
  by other shareholders/noteholders but had not been confirmed closed.
