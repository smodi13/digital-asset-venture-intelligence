unknowns:
  - id: gap-zodia-post-cutoff-restructuring
    whatWasSearched: >-
      Most recent status of the Standard Chartered acquisition and Zodia
      Solutions spin-out as close to the 2026-09-10 cutoff as could be found
    whatCouldNotBeEstablished: >-
      A CryptoBriefing report describing a leadership restructuring (Julian
      Sawyer stepping back from day-to-day CEO duties; Richard Clark
      overseeing the custody transition; Craig Perrin and Anoosh Arevshatian
      leading Zodia Solutions) was found, but its publication/availability
      date is 2026-09-11 -- one day after the research cutoff -- so per the
      cutoff rule (availabilityDate decisive, not the internal memo's stated
      2026-09-10 date) it is deliberately excluded from this packet's
      evidenceClaims and signalEvents.
    expectedToMatter: true
  - id: gap-zodia-deal-terms
    whatWasSearched: "Financial terms/valuation of the Standard Chartered acquisition of Zodia Custody"
    whatCouldNotBeEstablished: >-
      Both The Block and CoinDesk explicitly state financial terms were not
      disclosed by either party; no other source found within the research
      budget discloses deal value.
    expectedToMatter: true
  - id: gap-zodia-entity-boundary-post-deal
    whatWasSearched: >-
      The precise post-transaction legal/brand relationship between "Zodia
      Custody," the custody business being absorbed into Standard Chartered,
      and the newly announced "Zodia Solutions" entity
    whatCouldNotBeEstablished: >-
      No source found resolves whether the "Zodia Custody" brand persists
      as a distinct entity from Zodia Solutions post-close, or describes the
      same successor under different framing (see
      entityStructure.unresolvedBoundaryNotes).
    expectedToMatter: true
  - id: gap-zodia-aum-revenue
    whatWasSearched: "Assets under custody, revenue, or client-count figures for Zodia Custody"
    whatCouldNotBeEstablished: >-
      No source found within the research budget disclosed AUM, revenue, or
      a quantified client count; the July 2026 Disruption Banking article
      states "75+ crypto assets" supported but gives no AUM or revenue
      figure.
    expectedToMatter: true
  - id: gap-zodia-full-founding-team
    whatWasSearched: "Full founding team / executive roster beyond the CEO"
    whatCouldNotBeEstablished: >-
      Only the founding CEO (Maxime De Guillebon) and the later CEO (Julian
      Sawyer) are named across sources found; no broader founding-team
      roster was established.
    expectedToMatter: false
researchNotes:
  entityBoundaryUncertainty: >-
    As of the 2026-09-10 cutoff, Zodia Custody is an active, majority
    Standard-Chartered-owned entity with a pending (non-binding, accepted,
    not-yet-confirmed-closed) acquisition by Standard Chartered and a planned
    spin-out of its infrastructure platform into a new entity, Zodia
    Solutions. Treated in this packet as one entity (Zodia Custody, the
    Phase 3A universe subject) with the pending transaction and planned
    spin-out recorded as governance signal events rather than as separate
    entities, per the frozen category/entityType/assetType assignment. See
    entityStructure.unresolvedBoundaryNotes for what remains unresolved.
  sourceOriginUncertainty: >-
    The Block's May 18, 2026 report explicitly attributes its reporting to
    Bloomberg; CoinDesk's same-day report appears independently sourced
    (no shared byline or wire attribution found), so the two are treated as
    corroborating rather than duplicate voices for the acquisition-offer
    claim. The May 20, 2026 Zodia Solutions announcement is first-party
    (SC Ventures) only -- no independent-journalism corroboration of that
    specific entity/leadership detail was found within the research budget.
  likelyContradictions: >-
    The July 20, 2026 Disruption Banking article describes Zodia Custody's
    shareholder structure and Solutions arm as ongoing standalone operations
    without any mention of the May 2026 Standard Chartered acquisition
    announcement. This is recorded as a gap in that article's currency, not
    as evidence that the deal had lapsed; both are retained since the article
    is dated two months after the announcement and its silence is
    inconclusive either way.
  completenessNotes: >-
    Evidence density MODERATE per the frozen cohort assignment. Research
    established founding/ownership history (2020 JV, FCA registration 2021,
    2023 Series A, 2024 Emirates NBD investment), the May 2026 pending
    acquisition and planned Zodia Solutions spin-out (independently
    corroborated for the acquisition offer, single-voice for the Solutions
    entity/leadership detail), a June 2026 Luxembourg regulatory license, and
    product history (2023 institutional staking launch, Interchange
    off-venue settlement). A targeted search for security incidents found
    none attributed to Zodia Custody. Deal financial terms, AUM/revenue,
    full founding team, and the precise post-close entity boundary all
    remain open gaps. A September 11, 2026 report on further leadership
    restructuring was found but excluded as post-cutoff per the
    availabilityDate rule (see gap-zodia-post-cutoff-restructuring).
researchCutoff: "2026-09-10"
