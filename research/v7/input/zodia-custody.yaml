entityStructure:
  relationships:
    - description: >-
        Zodia Custody was founded in December 2020 as a joint venture between
        SC Ventures (Standard Chartered's innovation arm, majority
        shareholder) and Northern Trust (minority shareholder); SBI Holdings
        (Japan), National Australia Bank, and Emirates NBD later joined as
        additional minority shareholders (SBI's investment reported by
        CoinDesk April 2023; Emirates NBD's by Ledger Insights December
        2024).
      relatedEntityId: null
      relationType: joint_venture_shareholder
    - description: >-
        On May 18, 2026, Standard Chartered announced a non-binding offer,
        accepted by Zodia Custody's other shareholders and noteholders, to
        acquire the remainder of Zodia Custody's regulated custody business.
        Per the announcement, Zodia Custody's custody activities would
        integrate into Standard Chartered's own digital-asset custody
        business, while Zodia Custody's separate institutional
        infrastructure/technology platform ("Solutions") would be spun out
        into a new, independent entity, Zodia Solutions, operating under SC
        Ventures with Standard Chartered as an anchor client/shareholder.
        Julian Sawyer (then Zodia Custody CEO) was named as the intended CEO
        of Zodia Solutions upon transaction completion. As of the 2026-09-10
        cutoff, no source establishes that the acquisition or the Zodia
        Solutions spin-out had actually closed.
      relatedEntityId: null
      relationType: pending_acquisition_and_planned_spinout
  protocolNetworkRelationship: null
  unresolvedBoundaryNotes:
    - >-
      The exact current post-transaction ownership/entity boundary between
      "Zodia Custody" (the packet subject; the brand The Block reports will
      continue operating as a standalone SaaS platform after the transaction
      closes), the custody business being absorbed into Standard Chartered
      directly, and the newly announced "Zodia Solutions" entity is not
      fully resolved by any source found within the research budget for this
      batch: whether "Zodia Custody" as a company/brand persists distinctly
      from "Zodia Solutions," or the two names describe the same successor
      entity under different framing, is not conclusively established.
    - >-
      Deal consideration/financial terms of the Standard Chartered
      acquisition were not disclosed by any source found (CoinDesk and The
      Block both explicitly note terms were not disclosed).
    - >-
      A September 11, 2026 CryptoBriefing report (one day after the
      2026-09-10 research cutoff) describes a leadership restructuring --
      Julian Sawyer stepping back from day-to-day CEO duties, Richard Clark
      overseeing the custody-to-Standard-Chartered transition, and Craig
      Perrin/Anoosh Arevshatian leading Zodia Solutions -- that would bear
      directly on this entity-boundary question. Per the frozen research
      cutoff (availabilityDate, not publicationDate, is decisive; this
      article's publication/availability is 2026-09-11), this report is
      deliberately excluded from evidenceClaims and signalEvents in this
      packet and is recorded only as an unknowns/gap item.
