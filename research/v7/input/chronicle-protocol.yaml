  - id: clm-chronicle-chainsecurity-audit-2023
    schemaVersion: 7
    companyId: co-chronicle-protocol
    claim: >-
      ChainSecurity audited Chronicle's Scribe oracle mechanism ahead of
      its September 2023 public launch. The audit's stated scope covered
      functional correctness, integration of the signature scheme, and
      access control (plus code complexity, external-system integration,
      and documentation quality); the Schnorr signature scheme's underlying
      cryptography was explicitly excluded from scope. Three issues were
      identified (stale poke-data on update; finalized-status assessment
      after an authenticated action; unreset op-poke-data after an
      unsuccessful challenge), all of which were resolved or acknowledged
      by the Chronicle team. ChainSecurity's stated conclusion was that
      "the codebase provides a good level of security," not that the
      protocol is secure without qualification.
    statedValue: "3 issues found, all resolved or acknowledged"
    numericValue: 3
    unit: audit_findings
    sourceId: src-chronicle-chainsecurity-audit
    supportingSourceIds: [src-chronicle-launch-globenewswire-2023]
    sourceUrl: "https://www.chainsecurity.com/security-audit/chronicle-scribe-makerdao"
    publicationDate: null
    metricAsOfDate: "2023-09-05"
    lastVerified: "2026-09-11T00:00:00.000Z"
    provenance: sourced
    sourceSubtype: reported_fact
    confidence: medium_high
    modelEligibility: context_only
    topic: security
    notes: >-
      This audit covers the Scribe mechanism as it existed at the 2023
      launch. It is explicit evidence that a historical, scoped audit
      occurred with a specific, bounded scope (and one explicit exclusion:
      the Schnorr signature scheme cryptography itself). It is NOT evidence
      that Chronicle's current production contracts (as of the research
      cutoff) are comprehensively audited, nor that "Chronicle is secure"
      in any general sense; no audit report covering current code, and no
      exploit/incident history, was found within the research budget for
      this batch. These are two distinct claims and this packet keeps them
      distinct.
    evidenceStatus: supported
    analystInterpretation: null
    diligenceQuestion: >-
      Has Chronicle's Scribe mechanism, or any newer component, been
      audited again since 2023, and does any audit cover code changes made
      after the original review?
    researchAssessmentId: null
    hardeningRef: null
    verbatimExcerpt: >-
      The codebase provides a good level of security.
