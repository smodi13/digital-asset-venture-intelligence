evidenceClaims:
  - id: clm-wildcat-seed-extension
    schemaVersion: 7
    companyId: co-wildcat-protocol
    claim: >-
      Wildcat Labs raised $3.5 million in a seed-extension round (structured
      as a SAFE, opened April 2025 and closed August 2025, announced
      September 5, 2025) led by Robot Ventures at a $35 million post-money
      valuation, with participation from Triton Capital, Polygon Ventures,
      Safe Foundation, Hyperithm, Hermeneutic Investments, and Kronos
      Research, plus angel investors including Fei Protocol founder Joey
      Santoro, Vyper core contributor Charles Cooper, and Ink founder Andrew
      Koller. Total disclosed fundraising to date, including a $750,000
      pre-seed (May 2023, Wintermute Ventures) and a $1.1 million seed round
      (July-August 2024, primarily via Echo), is $5.3 million.
    statedValue: "$3.5 million (seed extension); $5.3 million total"
    numericValue: 3500000
    unit: usd
    sourceId: src-wildcat-theblock-seedext
