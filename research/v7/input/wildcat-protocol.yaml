    without a clear public explanation of their legal relationship; this
    packet treats them as the same operating entity for research purposes,
    consistent with the frozen universe assignment (entityType protocol).
  sourceOriginUncertainty: >-
    Funding and default facts are independently reported by The Block, a
    specialist crypto-industry outlet, not company press releases; the
    audit finding is from an independent third-party competitive-audit
    platform (Code4rena). No source-origin collapsing was required across
    these three distinct, non-overlapping origins.
  likelyContradictions: null
  completenessNotes: >-
    Consistent with the frozen THIN evidence-density label: capital history,
    founder identity, one material negative/risk event (the Kinto default),
    and one independent security audit are established. Legal-entity
    structure, token plans, and final realized recovery from the Kinto
