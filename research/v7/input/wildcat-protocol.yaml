  - id: clm-wildcat-kinto-default
    schemaVersion: 7
    companyId: co-wildcat-protocol
    claim: >-
      Kinto, a borrower on the Wildcat protocol operating the "Phoenix
      Facility" credit market, announced it would shut down after a summer
      2025 exploit drained $1.55 million from its lending pools and a
      subsequent $1 million recovery loan proved insufficient. Wildcat
      confirmed this was the protocol's first official borrower default
      since its 2023 launch, stated losses were isolated to the Phoenix
      Facility market, and that Phoenix lenders expected to recover
      approximately 76% of loan principal via pro-rata distribution of
      remaining foundation assets; Wildcat stated there was "no risk of
      contagion or haircut" to any other lender or borrower on the protocol.
      At the time of the report, Wildcat had $150+ million in outstanding
      credit across $368 million originated since launch.
    statedValue: "$1.55 million exploit loss; 76% expected principal recovery"
    numericValue: 1550000
    unit: usd
    sourceId: src-wildcat-theblock-kinto
    supportingSourceIds: []
    sourceUrl: "https://www.theblock.co/post/369879/crypto-lending-protocol-wildcat-says-kinto-default-poses-no-risk-of-contagion-for-outstanding-loans"
    publicationDate: "2025-09-08"
    metricAsOfDate: "2025-09-08"
    lastVerified: "2026-09-11T00:00:00.000Z"
    provenance: sourced
    sourceSubtype: reported_fact
    confidence: high
    modelEligibility: context_only
    topic: risk
    notes: >-
      Material negative/risk evidence: this is the protocol's first
      confirmed borrower default. Independently reported by The Block,
      including a direct Wildcat statement rather than only third-party
      characterization. The underlying Kinto exploit itself (loss of the
      capital that led to default) is a separate, upstream event at Kinto,
      not at Wildcat; Wildcat's own risk-isolation design (per-market
      whitelisting, no cross-market pooling) is what the "no contagion"
      claim rests on and was not independently stress-tested by this
      research.
    evidenceStatus: supported
    analystInterpretation: >-
      This is the kind of event that directly tests Wildcat's core design
      claim (borrower-level risk isolation via permissionless,
      undercollateralized markets): a real default occurred, and by the
      reporting available, losses appear to have stayed contained to the
      one affected market rather than spreading protocol-wide.
    diligenceQuestion: "Did losses in fact remain fully isolated to the Phoenix Facility market, and what is the final realized recovery rate for Phoenix lenders?"
    researchAssessmentId: null
    hardeningRef: null
    verbatimExcerpt: null
    contradicts: []
    contradictedBy: []
    contradictionNote: null
