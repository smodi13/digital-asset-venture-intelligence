financingStage: seed
cohort: CALIBRATION
nameAliasNote: >-
  IMPORTANT: an unrelated, unaffiliated earlier company also named "Skyfire"
  (Skyfire Labs, founded 2007 in Mountain View CA, maker of the Skyfire
  mobile web browser and Rocket Optimizer, acquired by Opera Software in
  2013 for $155M, browser discontinued 2014) shares the name with this
  entity. That company is unrelated to skyfire.xyz / the Agent Trust Stack
  / Amir Sarhangi and is explicitly excluded from this packet; no fact
  about the 2007 Skyfire Labs is used here.
entityTypeCorrectionNote: null
assetTypeCorrectionNote: >-
  No evidence of any Skyfire-issued token was found. Skyfire's payment
  rails move value via USDC stablecoin and traditional card/banking rails;
  USDC is a third-party stablecoin, not a Skyfire-issued instrument. The
  investable instrument, per available evidence, is equity in the
  operating company. assetType is kept as unknown (matching the frozen
  universe row) rather than corrected to equity, because no source in this
  research budget established capitalization/cap-table detail sufficient
  to confirm equity is the sole accessible instrument.
entityStructure:
  relationships: []
  protocolNetworkRelationship: >-
    Skyfire is a single operating company (no separate foundation, DAO, or
    on-chain protocol/network entity was found). It operates the KYA (Know
    Your Agent) identity protocol and the KYAPay payment/checkout protocol
    as company-controlled infrastructure; USDC settlement rides on
    existing public stablecoin rails Skyfire does not control or issue.
  unresolvedBoundaryNotes:
    - >-
      No source established Skyfire's state/country of incorporation, nor
      whether "KYA" / "KYAPay" are operated by any legally distinct
      subsidiary versus the parent operating company.
