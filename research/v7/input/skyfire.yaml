unknowns:
  - id: gap-skyfire-hq-incorporation
    whatWasSearched: "Skyfire's headquarters address, state/country of incorporation, and legal entity name"
    whatCouldNotBeEstablished: >-
      Secondary aggregator sources (search-engine company-profile
      snippets) describe Skyfire as San Francisco-based, but no primary or
      independent-journalism source directly established or confirmed a
      headquarters address or incorporation jurisdiction within this
      research budget, so this fact was not encoded as an EvidenceClaim.
    expectedToMatter: true
  - id: gap-skyfire-full-founder-roster
    whatWasSearched: "Whether Sarhangi and DeWitt are the only two founders or if additional co-founders exist"
    whatCouldNotBeEstablished: >-
      All sources consistently name only Amir Sarhangi and Craig DeWitt as
      co-founders; no source suggested additional founders, but no source
      explicitly confirmed a closed/complete founder list either.
    expectedToMatter: false
  - id: gap-skyfire-quantified-traction
    whatWasSearched: >-
      Quantified usage metrics: transaction volume, number of active
      agents/wallets, revenue, or customer count as of any date close to
      the 2026-09-10 cutoff
    whatCouldNotBeEstablished: >-
      No source with a clear value/period/asOf basis was found for
      transaction volume, revenue, or active-agent counts at any point in
      Skyfire's history. The March 2025 "beta exit" coverage referenced
      "strong traction during beta" without quantification. No
      digitalAssetMetrics record was created as a result.
    expectedToMatter: true
  - id: gap-skyfire-funding-since-2024
    whatWasSearched: "Any funding round after the October 2024 $9.5M seed total (e.g., a Series A)"
    whatCouldNotBeEstablished: >-
      No source within this research budget reported a priced or announced
      funding round after October 2024, through the 2026-09-10 cutoff.
      Given continued product launches (KYAPay mid-2025, F5 partnership
      March 2026) without a disclosed new round, it is unclear whether the
      company remains funded solely by the original $9.5M seed, has raised
      undisclosed capital, or is generating enough transaction-fee revenue
      to avoid raising.
    expectedToMatter: true
  - id: gap-skyfire-security-audit
    whatWasSearched: "Independent third-party security audit of the KYA/KYAPay protocol or wallet infrastructure"
    whatCouldNotBeEstablished: >-
      No independent security-audit report was found. Skyfire's own
      documentation describes token/claim-based security design (RFC-7515
      / RFC-7519 signed JWTs, published JWKS file, e2e HTTPS) but this is
      self-reported design description, not an independent audit.
    expectedToMatter: true
researchNotes:
  entityBoundaryUncertainty: >-
    Treated as a single operating company per the frozen universe
    assignment. No separate foundation, protocol-governance entity, or
    token-issuing entity was found distinct from the Skyfire operating
    company.
  sourceOriginUncertainty: >-
    IMPORTANT: an unrelated company also named "Skyfire" (Skyfire Labs,
    2007-2013, mobile browser / Opera acquisition) surfaced during
    research via a Wikipedia article and is explicitly excluded, see
    nameAliasNote. No fact from that unrelated company appears in this
    packet. Separately, the March 2025 "beta exit" coverage
    (theaiinsider.tech) reads as substantially press-release-derived
    (flagged isPressReleaseReproduction: true) and is treated as a weaker,
    lower-tier corroborating source rather than primary-fact-bearing on
    its own for any claim also covered by a stronger outlet.
  likelyContradictions: null
  completenessNotes: >-
    Evidence density MODERATE per the frozen cohort assignment, consistent
    with what was found: two independent, well-corroborated funding
    announcements (Aug/Oct 2024), consistent founder identity across
    sources, two later product/partnership milestones (KYAPay mid-2025,
    F5 partnership March 2026) with genuinely independent corroboration
    (a public company's own investor newsroom for the F5 deal). Capital
    efficiency and growth-momentum evidence remain thin: no quantified
    traction metric, no confirmed post-seed financing, and no independent
    security audit were found despite deliberate searching, consistent
    with an early-stage company two years past its only disclosed raise.
researchCutoff: "2026-09-10"
