slug: skyfire
description: >-
  Skyfire (skyfire.xyz) builds the "Agent Trust Stack," payment
  infrastructure that gives AI agents verifiable identity (the KYA / Know
  Your Agent protocol) and their own USDC-stablecoin or card-rail-backed
  wallets so they can autonomously identify themselves and transact without
  human intervention at time of payment.
