unknowns:
  - id: gap-spheron-funding-rounds-unadmissible
    whatWasSearched: >-
      Spheron's funding history (seed, Series A/$7M round, February 2025
      strategic round) via two independent fundraising-tracker aggregators
      (Gate.com, crypto-fundraising.info)
    whatCouldNotBeEstablished: >-
      Both aggregator pages describe historical rounds (2021, 2022/2023,
      2025) but neither page carries a disclosed publication/last-updated
      date, so no admissible availabilityDate on or before the 2026-09-10
      cutoff could be responsibly established for either page per this
      batch's cutoff-discipline rules (a live page's current content cannot
      be assumed to have been available at cutoff without a captured
      date). The two pages also conflict with each other on the dating of a
      $7 million round (2022-07-31 per Gate.com vs. October 2023 per
      crypto-fundraising.info), which would have been recorded as an
      explicit conflict had the sources been cutoff-admissible. No
      EvidenceClaim or SignalEvent was created for any of these rounds as a
      result; both source records are retained in the packet as
      non-evidence-bearing research leads only.
    expectedToMatter: true
  - id: gap-spheron-founders
    whatWasSearched: "Founder/leadership team names via company site, LinkedIn, org-chart aggregators (TheOrg, Wellfound, CB Insights)"
    whatCouldNotBeEstablished: >-
      Search results repeatedly attribute Spheron's founding to "Prashant
      Maurya" and "Mitrasish Mukherjee," but every candidate primary source
      (TheOrg profile, Wellfound team page) returned an access error (404 /
      403) when opened directly in this research pass, and the only
      remaining leads were AI-synthesized search summaries, which this
      batch's sourcing rules exclude as final evidence. No people records
      were created for this packet as a result.
    expectedToMatter: true
  - id: gap-spheron-arr-figure
    whatWasSearched: >-
      The frozen universe lead's "$12M ARR by August 2025" figure,
      attributed to a Messari/Blockworks report
    whatCouldNotBeEstablished: >-
      messari.io/report/understanding-spheron-a-comprehensive-overview
      returned HTTP 429 on repeated attempts, and a mirror
      (coinstrooper.com) returned HTTP 403; the figure could not be
      independently opened and verified within this batch's research
      budget. Only a lower, self-reported $10M ARR figure (dated 2025-07-25,
      see clm-spheron-arr-selfreported) was independently sourced.
    expectedToMatter: true
  - id: gap-spheron-legal-entity-vs-fundraising-entity
    whatWasSearched: >-
      Whether "Beta360 Pte Ltd" (named in the website Terms of Use) is the
      same legal entity that raised the 2021-2025 funding rounds
    whatCouldNotBeEstablished: >-
      No source connects the Terms-of-Use entity name to any funding
      announcement or aggregator record; a separate, unopened secondary
      search lead suggested a British Virgin Islands entity name
      ("Permanent Hosting Solutions..."), but this was not verified against
      an actual source page and is excluded from this packet's evidence for
      that reason.
    expectedToMatter: true
  - id: gap-spheron-security-audit
    whatWasSearched: "Smart contract / protocol security audit scope, date, and findings (QuillAudits, CertiK Skynet)"
    whatCouldNotBeEstablished: >-
      QuillAudits and CertiK Skynet pages referencing "Spheron-V1" /
      "Spheron Protocol" were located, but the actual audit date, scope,
      and findings (critical/high/medium/low counts) could not be extracted
      from the fetched page content within this batch's research budget; no
      security_audit source or EvidenceClaim was created as a result.
    expectedToMatter: true
  - id: gap-spheron-revenue-methodology
    whatWasSearched: "Revenue-recognition methodology behind self-reported ARR figures"
    whatCouldNotBeEstablished: >-
      No source (company or independent) states whether "ARR" refers to
      gross marketplace payment volume, net protocol take-rate, or another
      basis; two internally-inconsistent self-reported scale-metric sets
      were found instead (see clm-spheron-network-scale-selfreported).
    expectedToMatter: true
researchNotes:
  entityBoundaryUncertainty: >-
    Treated as one network entity ("Spheron Network," formerly "ArGo") per
    the frozen universe assignment, spanning a company/network duality
    (assetType equity_and_token): "Beta360 Pte Ltd" is named as the
    operating legal entity in the site's Terms of Use, but its relationship
    to the SPON token / on-chain network and to the entity that raised prior
    funding rounds is not independently established.
  sourceOriginUncertainty: >-
    The Defiant press-release-wire article and Gate.com/crypto-fundraising.info
    aggregator pages are all treated as non-independent of Spheron's own
    disclosures for network-scale and ARR figures (self-reported, no
    independent verification found); the two funding aggregators are
    independent of Spheron but plausibly share some upstream data sourcing
    with each other (their $7M-round dating conflict suggests they are NOT
    simply copying one shared source, but neither is confirmed as
    editorially independent research either).
  likelyContradictions: >-
    See gap-spheron-funding-rounds-unadmissible (conflicting, non-admissible
    $7M round dating between two aggregators) and
    clm-spheron-network-scale-selfreported (two non-matching self-reported
    node/compute scale figures from different disclosures).
  completenessNotes: >-
    Evidence density MODERATE per the frozen cohort assignment; actual
    research depth in this pass fell short of that label on CAPITAL
    specifically (see gap-spheron-funding-rounds-unadmissible: the only
    funding-history sources found were undated aggregator pages that could
    not be admitted as cutoff-compliant evidence), while IDENTITY (legal
    entity), business-model self-disclosures, and the token-launch signal
    are ESTABLISHED/PARTIAL as documented below. IDENTITY is PARTIAL
    (legal entity sourced, but its link to the fundraising history is
    unresolved). CAPITAL is an OPEN_RESEARCH_GAP for this pass, a
    discrepancy from the frozen MODERATE label recorded here rather than
    used to change the label. TEAM/GOVERNANCE is an OPEN_RESEARCH_GAP: no
    people record was created because the only available leads failed
    direct verification or were AI-synthesized search summaries excluded by
    this batch's sourcing rules. ADOPTION and BUSINESS MODEL rely entirely
    on self-reported, internally-inconsistent figures and are recorded as
    insufficient evidence rather than encoded as digitalAssetMetrics.
    TECHNICAL/SECURITY (audit scope/findings) is an OPEN_RESEARCH_GAP.
researchCutoff: "2026-09-10"
