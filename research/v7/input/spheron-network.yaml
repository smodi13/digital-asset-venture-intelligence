nameAliasNote: >-
  The project began as "ArGo" (decentralized hosting) before being
  relaunched as "Spheron" in 2021; some funding aggregators additionally
  label the underlying token entity "Spheron Protocol." No source resolves
  the exact relationship among "ArGo," "Spheron Network," "Spheron
  Protocol," and the entity operating spheron.network's Terms of Use
  ("Beta360 Pte Ltd") beyond a d/b/a-style continuity narrative; treated as
  one entity per the frozen universe assignment.
