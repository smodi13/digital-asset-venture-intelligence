entityStructure:
  relationships:
    - description: >-
        The operative legal entity named in Spheron Network's own website
        Terms of Use is "Beta360 Pte Ltd," a Singapore-incorporated company
        (UEN 202107371K), registered at 3 Phillip Street, #10-04, Royal
        Group Building, Singapore 048693. No source independently confirms
        whether this is the same entity that raised the 2021-2025 funding
        rounds attributed to "Spheron"/"Spheron Protocol," or a separate
        operating/holding entity.
      relatedEntityId: null
      relationType: operating_entity_of_network
  protocolNetworkRelationship: >-
    Spheron Network is described across sources as a single decentralized
    compute network/company; no separate foundation-vs-core-developer split
    (of the kind seen in some other DePIN projects) was established in this
    research pass. The SPON token (launched July 2025) is stated to be used
    for compute payment, staking, node-operator rewards, and future
    governance.
  unresolvedBoundaryNotes:
    - >-
      Funding aggregators disagree on the dating and labeling of a $7
      million round: Gate.io's fundraising page dates a "Series A" to
      2022-07-31 with one investor list, while crypto-fundraising.info dates
      a $7 million round to 2023-10 with an overlapping but not identical
      investor list (see gap-spheron-funding-rounds-unadmissible). Neither
      aggregator page carries a disclosed date, so neither could be treated
      as cutoff-admissible evidence in this packet; no EvidenceClaim was
      created for either dating, and whether these are the same event or
      two distinct $7M raises remains unresolved.
    - >-
      No source in this research pass named Spheron's founders through a
      primary or independent-journalism source (only secondary
      aggregator/social-profile leads were found); founder identity is
      recorded as an open gap rather than asserted from unopened or
      AI-synthesized search results.
