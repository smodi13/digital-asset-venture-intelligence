criterionJudgments:
  - criterionId: observable_scale_vs_capital
    applicability: applicable
    rawAnchor: 50
    coverage: 0.5
    citedEvidenceClaimIds: [clm-huma-equity-10m-2024, clm-huma-reported-volume]
    rationale: "Independent reporting establishes $10 million of equity financing, while Huma reports more than $7 billion of cumulative onchain volume. The volume is first-party, not independently verified, and neither capital consumed nor comparable operating output is established, so the evidence is relevant but directionally inconclusive."
    acknowledgedContradictionIds: []
    evidenceGapNote: "Capital spent and independently reproducible operating-scale measures are unavailable."
  - criterionId: operating_resource_intensity
    applicability: applicable
    rawAnchor: 50
    coverage: 0.5
    citedEvidenceClaimIds: [clm-huma-payfi-mechanism, clm-huma-institutional-access]
    rationale: "Company-controlled documentation shows a model requiring liquidity-pool capital and, for the institutional product, professional-investor qualification and KYC/KYB. These requirements establish relevant resources but not their recurring cost or directional intensity."
    acknowledgedContradictionIds: []
    evidenceGapNote: "Labor, infrastructure, liquidity-subsidy, and compliance operating costs are not quantified."
  - criterionId: adoption_and_usage_momentum
    applicability: applicable
    rawAnchor: 50
    coverage: 0.5
    citedEvidenceClaimIds: [clm-huma-reported-volume]
    rationale: "Huma reports more than $7 billion of cumulative onchain transaction volume, which is relevant usage evidence but is a first-party point-in-time cumulative figure without a comparable time series, retention, or independently reproducible methodology."
    acknowledgedContradictionIds: []
    evidenceGapNote: "Temporal usage, unique-user, repeat-use, and retention evidence is unavailable."
  - criterionId: developer_and_ecosystem_momentum
    applicability: applicable
    rawAnchor: 50
    coverage: 0.5
    citedEvidenceClaimIds: [clm-huma-permissionless-launch]
    rationale: "Company-controlled documentation establishes a permissionless Solana launch, which is relevant ecosystem context but a product release alone does not establish external developer growth, expanding integrations, or sustained external usage."
    acknowledgedContradictionIds: []
    evidenceGapNote: "External developer, contributor, integration-growth, and sustained ecosystem-usage evidence is unavailable."
  - criterionId: team_execution_credibility
    applicability: applicable
    rawAnchor: 55
    coverage: 0.5
    citedEvidenceClaimIds: [clm-huma-arf-merger, clm-huma-permissionless-launch, clm-huma-reported-volume]
    rationale: "The team completed the Arf merger and, according to company-controlled documentation, delivered a permissionless Solana product and substantial cumulative transaction volume. This supports limited favorable execution direction, while the operating metric remains company-reported and not independently verified."
    acknowledgedContradictionIds: []
    evidenceGapNote: "Role-specific delivery attribution and independently verified operating execution remain limited."
  - criterionId: governance_and_incentive_alignment
    applicability: applicable
    rawAnchor: 50
    coverage: 0.5
    citedEvidenceClaimIds: [clm-huma-token-allocation, clm-huma-token-supply]
