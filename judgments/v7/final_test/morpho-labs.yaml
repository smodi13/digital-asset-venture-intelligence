criterionJudgments:
  - criterionId: observable_scale_vs_capital
    applicability: applicable
    rawAnchor: 50
    coverage: 0.5
    citedEvidenceClaimIds: [clm-morpho-token-financing-50m, clm-morpho-prior-financing-18m, clm-morpho-2025-users, clm-morpho-2025-deposits]
    rationale: "Independent reporting establishes $50 million of private-token financing and $18 million of earlier unspecified financing; Morpho reports 1.4 million-plus users and $13 billion of deposits by year-end 2025. The scale figures are first-party, deposits are protocol liquidity, and capital consumed is unknown, leaving direction inconclusive."
    acknowledgedContradictionIds: []
    evidenceGapNote: "Capital spent and independently verified, comparable operating-scale measures are unavailable."
  - criterionId: operating_resource_intensity
    applicability: applicable
    rawAnchor: 50
    coverage: 0.5
    citedEvidenceClaimIds: [clm-morpho-protocol-architecture, clm-morpho-2025-deposits]
    rationale: "First-party evidence describes immutable isolated lending markets and substantial externally supplied deposits. This establishes relevant infrastructure and liquidity resources but not Morpho's recurring labor, compute, subsidy, or operating burden."
    acknowledgedContradictionIds: []
    evidenceGapNote: "Recurring company and protocol resource costs are not quantified."
  - criterionId: adoption_and_usage_momentum
    applicability: applicable
    rawAnchor: 70
    coverage: 0.5
    citedEvidenceClaimIds: [clm-morpho-2025-users, clm-morpho-2025-deposits]
    rationale: "Morpho reports users increasing from 67,000 to more than 1.4 million and deposits from $5 billion to $13 billion during 2025, providing favorable temporal direction. Both series are first-party, not independently verified, and lack user-definition and retention methodology."
    acknowledgedContradictionIds: []
    evidenceGapNote: "Independent measurement, deduplication, retained cohorts, and repeat-borrowing data are unavailable."
  - criterionId: developer_and_ecosystem_momentum
    applicability: applicable
    rawAnchor: 50
    coverage: 0.5
    citedEvidenceClaimIds: [clm-morpho-coinbase-integration]
    rationale: "Independent reporting establishes a live Coinbase integration using Morpho markets on Base. It is relevant external ecosystem evidence, but one launch without a time series, retained usage, or broader integration growth is directionally inconclusive for momentum."
    acknowledgedContradictionIds: []
    evidenceGapNote: "External-developer growth, contributor growth, and sustained integration expansion are unavailable."
  - criterionId: team_execution_credibility
    applicability: applicable
    rawAnchor: 60
    coverage: 0.5
    citedEvidenceClaimIds: [clm-morpho-protocol-architecture, clm-morpho-coinbase-integration]
    rationale: "The team delivered an immutable isolated-market architecture and a live Coinbase-powered lending integration independently reported in production. This supports favorable execution credibility without relying on founder identity or investor prestige."
    acknowledgedContradictionIds: []
    evidenceGapNote: "Role-specific attribution and broader independently verified operating delivery remain limited."
  - criterionId: governance_and_incentive_alignment
    applicability: applicable
    rawAnchor: 50
    coverage: 0.5
    citedEvidenceClaimIds: [clm-morpho-governance-scope, clm-morpho-token-supply]
    rationale: "Association-controlled documentation identifies governance rights over treasury assets, fee activation, whitelisted parameters, and a fixed token maximum. These facts establish control structure but not holder concentration, multisig accountability, or favorable economic alignment."
    acknowledgedContradictionIds: []
    evidenceGapNote: "Token distribution, voting concentration, multisig composition, and company-association alignment are unresolved."
  - criterionId: problem_urgency_and_market_depth
    applicability: applicable
    rawAnchor: 65
    coverage: 0.5
    citedEvidenceClaimIds: [clm-morpho-coinbase-integration, clm-morpho-2025-users, clm-morpho-2025-deposits]
    rationale: "A live Coinbase lending channel independently establishes integrator commitment, while Morpho reports strong 2025 user and deposit growth. Together they support favorable demand and market-depth direction, with limited coverage because the scale metrics are first-party and retention is absent."
    acknowledgedContradictionIds: []
    evidenceGapNote: "Paid-use, retention, borrower-repeat, and protocol-fee evidence is incomplete."
  - criterionId: structural_and_regulatory_fit
    applicability: applicable
    rawAnchor: 50
    coverage: 0.5
    citedEvidenceClaimIds: [clm-morpho-protocol-architecture, clm-morpho-association]
    rationale: "First-party materials establish immutable permissionless lending contracts and a French nonprofit supporting protocol adoption and interfaces. These structural facts are relevant but do not establish the regulatory trajectory or jurisdictional advantage or hostility."
    acknowledgedContradictionIds: []
    evidenceGapNote: "Applicable legal analysis, enforcement exposure, and company-association contractual boundaries are unavailable."
  - criterionId: value_capture_model
    applicability: applicable
    rawAnchor: 50
    coverage: 0.5
    citedEvidenceClaimIds: [clm-morpho-governance-scope]
    rationale: "Protocol documentation discloses a designed fee switch capped at 25% of borrower interest. It does not establish that fees were active, their realized amount, beneficiary, or any Morpho Labs revenue, so value-capture direction remains neutral."
    acknowledgedContradictionIds: []
    evidenceGapNote: "Active fee schedules, realized fees, recipients, and company monetization are unavailable."
  - criterionId: economic_sustainability
    applicability: applicable
    rawAnchor: 50
    coverage: 0
