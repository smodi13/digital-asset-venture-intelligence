    rationale: "Permissionless isolated-market creation and a live Coinbase interface provide concrete ecosystem-access paths, supporting limited favorable direction. The frozen evidence does not quantify onboarding, integration, wallet, oracle, or collateral friction."
    acknowledgedContradictionIds: []
    evidenceGapNote: "Implementation time, rejection or failure rates, and end-user onboarding friction are unavailable."
  - criterionId: technical_and_product_differentiation
    applicability: applicable
    rawAnchor: 60
    coverage: 0.5
    citedEvidenceClaimIds: [clm-morpho-protocol-architecture]
    rationale: "First-party protocol documentation describes immutable isolated markets with market-specific collateral, loan asset, oracle, rate model, and liquidation parameters, supporting limited favorable architectural differentiation. No independent comparative evaluation establishes superiority."
    acknowledgedContradictionIds: []
    evidenceGapNote: "Independent comparative validation and performance evidence are unavailable."
  - criterionId: defensibility_security_and_network_effects
    applicability: applicable
    rawAnchor: 45
    coverage: 1
    citedEvidenceClaimIds: [clm-morpho-vulnerability-2023, clm-morpho-chainsecurity-scope]
    rationale: "Morpho's first-party postmortem documents a vulnerability serious enough to pause supply, although it was responsibly disclosed and patched without a documented theft. An independent ChainSecurity audit also identified a scoped data-structure insufficiency and cautioned that audits cannot find every vulnerability, supporting modest adverse security direction rather than broad safety or defensibility claims."
    acknowledgedContradictionIds: []
    evidenceGapNote: "Later-deployment audit coverage, complete incident history, switching costs, and durable network effects remain incomplete."
analystNote: "Judged only from the frozen Morpho Labs FINAL_TEST packet; no external research or aggregate scoring was used."
