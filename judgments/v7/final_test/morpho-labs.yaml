    rationale: "The frozen packet does not provide criterion-relevant evidence sufficient to compare realized revenue, costs, margins, burn, incentives, or subsidy dependence."
    acknowledgedContradictionIds: []
    evidenceGapNote: "Company economics and complete protocol fee economics are unavailable."
  - criterionId: distribution_and_integration_pull
    applicability: applicable
    rawAnchor: 65
    coverage: 0.5
    citedEvidenceClaimIds: [clm-morpho-coinbase-integration]
    rationale: "Independent reporting establishes that Coinbase launched Bitcoin-backed USDC loans using Morpho on Base, a functioning major distribution integration. Favorable direction is limited by the absence of retained borrowers, expansion, or repeatable channel evidence."
    acknowledgedContradictionIds: []
