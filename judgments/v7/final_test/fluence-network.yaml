criterionJudgments:
  - criterionId: observable_scale_vs_capital
    applicability: applicable
    rawAnchor: 50
    coverage: 0.5
    citedEvidenceClaimIds: [clm-fluence-series-a, clm-fluence-total-funding, clm-fluence-network-revenue-2025]
    rationale: "Independent reporting establishes a $9 million Series A and Cloudless reports $14 million total funding; Fluence also reports $1 million of cumulative network revenue. The revenue is first-party, combines FLT and USD, is not company revenue, and capital consumed is unknown, so direction remains neutral."
    acknowledgedContradictionIds: []
    evidenceGapNote: "Capital spent and independently verified company-level operating output are unavailable."
  - criterionId: operating_resource_intensity
    applicability: applicable
    rawAnchor: 40
    coverage: 1
    citedEvidenceClaimIds: [clm-fluence-mainnet, clm-fluence-development-subsidy]
    rationale: "The live marketplace depends on compute providers, cross-chain components, a dedicated IPC chain, bridge, and capacity commitments, while a DAO proposal funded Cloudless Labs with $400,000 monthly operations, up to $250,000 monthly marketing, and a $1 million setup reimbursement. The disclosed operating support provides adverse resource-intensity direction, without assuming the network footprint alone is negative."
    acknowledgedContradictionIds: []
    evidenceGapNote: "Provider costs, utilization, post-2024 payments, and the share of spending dependent on DAO support remain incomplete."
  - criterionId: adoption_and_usage_momentum
    applicability: applicable
    rawAnchor: 50
    coverage: 0.5
    citedEvidenceClaimIds: [clm-fluence-network-revenue-2025, clm-fluence-gpu-launch]
    rationale: "Fluence reports $1 million of cumulative network revenue by December 2025 and a live GPU marketplace with one signed deal. These first-party snapshots establish activity but not comparable temporal growth, persistence, repeat use, or retention."
    acknowledgedContradictionIds: []
    evidenceGapNote: "Active buyers, workloads, compute hours, utilization, repeat use, and retention series are unavailable."
  - criterionId: developer_and_ecosystem_momentum
    applicability: applicable
    rawAnchor: 50
    coverage: 0.5
    citedEvidenceClaimIds: [clm-fluence-mainnet, clm-fluence-open-source]
    rationale: "Fluence reports a mainnet integrating Ethereum, Filecoin, Axelar, and IPC components and publishes its network and developer-tool repositories. These first-party facts are relevant but do not establish external contributor growth, third-party integration expansion, or sustained external usage."
    acknowledgedContradictionIds: []
    evidenceGapNote: "External contributors, active developers, integration growth, and retained ecosystem usage are unavailable."
  - criterionId: team_execution_credibility
    applicability: applicable
    rawAnchor: 55
    coverage: 0.5
    citedEvidenceClaimIds: [clm-fluence-mainnet, clm-fluence-network-revenue-2025, clm-fluence-gpu-launch]
    rationale: "The team delivered the Kras mainnet and later reported network revenue and a live GPU marketplace with a signed deal. This supports limited favorable execution direction, while all delivery and operating evidence here is first-party and the operating measures are not independently verified."
    acknowledgedContradictionIds: []
    evidenceGapNote: "Independent operating validation and role-specific delivery attribution remain limited."
  - criterionId: governance_and_incentive_alignment
    applicability: applicable
    rawAnchor: 50
    coverage: 0.5
    citedEvidenceClaimIds: [clm-fluence-payment-staking, clm-fluence-development-subsidy, clm-fluence-dao-treasury, clm-fluence-token-supply]
    rationale: "First-party and governance records disclose FLT staking and governance, DAO funding to Cloudless Labs, treasury assets, and token supply. These facts establish an incentive and control structure but not holder concentration, emissions, voting accountability, or favorable company-DAO alignment."
    acknowledgedContradictionIds: []
    evidenceGapNote: "Token allocation, voting concentration, emissions, and company-DAO contractual alignment are unresolved."
  - criterionId: problem_urgency_and_market_depth
    applicability: applicable
    rawAnchor: 60
    coverage: 0.5
    citedEvidenceClaimIds: [clm-fluence-provider-economics-2025, clm-fluence-network-revenue-2025, clm-fluence-gpu-launch]
    rationale: "Fluence reports provider annualized revenue, user savings above $4 million, $1 million of cumulative network revenue, and a signed GPU deal, providing limited favorable evidence of paid demand and customer value. These figures are first-party, not independently verified, and lack buyer, utilization, and revenue-allocation detail."
    acknowledgedContradictionIds: []
    evidenceGapNote: "Paying-customer counts, workloads, utilization, repeat demand, and independently verified market depth are unavailable."
