  - criterionId: value_capture_model
    applicability: applicable
    rawAnchor: 60
    coverage: 0.5
    citedEvidenceClaimIds: [clm-fluence-payment-staking, clm-fluence-network-revenue-2025]
    rationale: "Fluence documents stablecoin compute payments and reports $1 million of cumulative FLT- and USD-denominated network revenue, supporting a recurring usage-payment path and limited favorable protocol-level capture. Both are first-party, and company take rate or recognized revenue is not established."
    acknowledgedContradictionIds: []
    evidenceGapNote: "Provider share, protocol fees, currency conversion, and Cloudless Labs monetization are unavailable."
  - criterionId: economic_sustainability
    applicability: applicable
    rawAnchor: 40
    coverage: 0.5
    citedEvidenceClaimIds: [clm-fluence-development-subsidy, clm-fluence-network-revenue-2025]
    rationale: "Governance records document substantial monthly operating and marketing support to Cloudless Labs, while Fluence later reports only $1 million of cumulative network revenue that is distinct from company revenue. The disclosed reliance on ecosystem funding during the proposal period supports adverse sustainability direction, though periods and entities cannot be directly netted."
    acknowledgedContradictionIds: []
    evidenceGapNote: "Company revenue, costs, margins, post-period DAO dependence, and provider economics are incomplete."
