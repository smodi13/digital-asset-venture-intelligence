  - criterionId: value_capture_model
    applicability: applicable
    rawAnchor: 50
    coverage: 0.5
    citedEvidenceClaimIds: [clm-espresso-nitro-fees]
    rationale: Company-controlled documentation establishes that network fees existed for Nitro integrations and were initially covered by Espresso. It does not establish pricing, fee ownership, recurring company revenue, or token accrual, so value-capture direction remains neutral.
    acknowledgedContradictionIds: []
    evidenceGapNote: Espresso Systems revenue and ownership of network fee flows were not established.
  - criterionId: economic_sustainability
    applicability: applicable
    rawAnchor: 40
    coverage: 0.5
    citedEvidenceClaimIds: [clm-espresso-nitro-fees]
    rationale: Company-controlled documentation says Espresso initially subsidized network fees for Nitro integrations, which is actual adverse evidence of subsidy dependence during Mainnet 0. The cost, duration, current status, and offsetting economics were not established.
    acknowledgedContradictionIds: []
    evidenceGapNote: Revenue, costs, margins, burn, runway, and the magnitude and duration of fee subsidies were not established.
  - criterionId: distribution_and_integration_pull
    applicability: applicable
    rawAnchor: 50
    coverage: 0.5
    citedEvidenceClaimIds: [clm-espresso-nitro-trust, clm-espresso-nitro-fees]
    rationale: Company-controlled documentation describes a Nitro integration route and refers to integrations receiving initially subsidized fees. This is relevant integration evidence, but no named live customer, repeatable acquisition pattern, or organic channel pull is independently verified.
    acknowledgedContradictionIds: []
    evidenceGapNote: Live paying integrations, repeat customers, customer expansion, and acquisition repeatability were not established.
  - criterionId: adoption_friction_and_ecosystem_access
    applicability: applicable
    rawAnchor: 50
    coverage: 0.5
    citedEvidenceClaimIds: [clm-espresso-nitro-trust]
    rationale: Company-controlled documentation describes a minimal-change Nitro integration that relies on a trusted execution environment. The workflow is criterion-relevant, but neither the claimed ease nor the TEE dependency alone establishes favorable or adverse adoption friction.
    acknowledgedContradictionIds: []
    evidenceGapNote: Measured integration time, implementation burden, audit requirements, and production onboarding outcomes were not established.
  - criterionId: technical_and_product_differentiation
    applicability: applicable
    rawAnchor: 55
    coverage: 0.5
    citedEvidenceClaimIds: [clm-espresso-cappuccino, clm-espresso-mainnet0-production, clm-espresso-nitro-trust]
    rationale: Company-controlled documentation identifies HotShot, Tiramisu data availability, a production network, and a minimal-change Nitro path using a TEE. These are limited favorable capability and architecture signals, but comparative superiority and independently validated deployed functionality are not established.
    acknowledgedContradictionIds: []
    evidenceGapNote: Independent comparative assessment and complete validation of cutoff-date production functionality were not established.
  - criterionId: defensibility_security_and_network_effects
    applicability: applicable
    rawAnchor: 55
    coverage: 0.5
    citedEvidenceClaimIds: [clm-espresso-audit-corpus, clm-espresso-audit-finding, clm-espresso-mainnet0-production]
    rationale: Espresso's company-controlled repository lists multiple scoped external reviews, and Informal Systems independently reviewed epoch-transition code and reported specification-to-implementation differences; company documentation also reports 20 operators. This is limited favorable security-posture evidence with a concrete caveat, not proof of broad safety, switching costs, or network effects.
    acknowledgedContradictionIds: []
    evidenceGapNote: Complete deployed-code audit coverage, durable operator participation, switching costs, and network effects were not established.
