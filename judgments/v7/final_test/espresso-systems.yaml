criterionJudgments:
  - criterionId: observable_scale_vs_capital
    applicability: applicable
    rawAnchor: 50
    coverage: 0.5
    citedEvidenceClaimIds: [clm-espresso-funding-2022, clm-espresso-funding-2024, clm-espresso-mainnet0-production]
    rationale: Independent reporting establishes $60 million of aggregate primary-company financing, while company documentation reports a production release with 20 operators and 100 nodes. Capital raised is not capital consumed, and the operating footprint does not establish customer or transaction scale, so the comparison is relevant but directionally inconclusive.
    acknowledgedContradictionIds: []
    evidenceGapNote: Actual capital deployed and independently verified production usage were not established.
  - criterionId: operating_resource_intensity
    applicability: applicable
    rawAnchor: 45
    coverage: 0.5
    citedEvidenceClaimIds: [clm-espresso-mainnet0-production, clm-espresso-nitro-fees]
    rationale: Company-controlled documentation reports a 100-node production footprint and says Espresso initially covered network fees for Nitro integrations. The explicit fee subsidy is adverse resource-burden evidence, but its amount and duration and the company's recurring infrastructure costs are not independently verified.
    acknowledgedContradictionIds: []
    evidenceGapNote: Recurring labor, compute, operator, subsidy-cost, and company expense data were not established.
  - criterionId: adoption_and_usage_momentum
    applicability: applicable
    rawAnchor: 50
    coverage: 0.5
    citedEvidenceClaimIds: [clm-espresso-cappuccino, clm-espresso-mainnet0-production]
    rationale: Company documentation reports a move from a testnet with 10 operators and 100 nodes to a production release with 20 operators and 100 nodes. This is temporal deployment evidence, but it does not establish growth in paying rollups, customers, transactions, or retained usage.
    acknowledgedContradictionIds: []
    evidenceGapNote: Independently verified current customer counts, paying-rollup counts, and sustained production volume were not established.
  - criterionId: developer_and_ecosystem_momentum
    applicability: applicable
    rawAnchor: 55
    coverage: 0.5
    citedEvidenceClaimIds: [clm-espresso-cappuccino, clm-espresso-mainnet0-production]
    rationale: Company-reported operator participation increased from 10 operators on Cappuccino to 20 on Mainnet 0, providing limited favorable temporal evidence of external network-participant expansion. The node count remained 100 and external developer, contributor, and live third-party integration growth were not independently verified.
    acknowledgedContradictionIds: []
    evidenceGapNote: External developer growth, contributor retention, and independently verified integration expansion were not established.
  - criterionId: team_execution_credibility
    applicability: applicable
    rawAnchor: 55
    coverage: 0.5
    citedEvidenceClaimIds: [clm-espresso-mainnet0-production, clm-espresso-audit-finding]
    rationale: Company documentation reports delivery of HotShot into a production release, and an independent scoped review examined epoch-transition implementation and found specification-to-code differences. Shipping reviewed network software is limited favorable execution evidence, while the delivery claim remains company-reported and the review was bounded in scope.
    acknowledgedContradictionIds: []
    evidenceGapNote: Broader independently verified operating execution and current deployed-code audit coverage were not established.
