  - criterionId: distribution_and_integration_pull
    applicability: applicable
    rawAnchor: 65
    coverage: 0.5
    citedEvidenceClaimIds: [clm-pimlico-safe-integration, clm-pimlico-audit-usage]
    rationale: Safe Foundation confirms a functioning canonical-module integration, and Nethermind reports service activity across six chains. This is favorable evidence of integration-based distribution, though repeat sales, organic pull, customer expansion, and acquisition economics are not established.
