    rawAnchor: 40
    coverage: 0.5
    citedEvidenceClaimIds: [clm-pimlico-inclusion-limit, clm-pimlico-safe-integration]
    rationale: Safe integration demonstrates ecosystem access, but the founder reported private-mempool constraints and inclusion delays affecting about 40% of user operations at the time. The explicit delay evidence supports an adverse anchor, with current prevalence and onboarding burden unresolved.
    acknowledgedContradictionIds: []
    evidenceGapNote: Current inclusion reliability, onboarding time, implementation burden, and chain-by-chain production outcomes were not established.
  - criterionId: technical_and_product_differentiation
    applicability: applicable
    rawAnchor: 55
    coverage: 0.5
    citedEvidenceClaimIds: [clm-pimlico-product, clm-pimlico-open-source, clm-pimlico-audit]
    rationale: Pimlico offers hosted bundlers and paymasters with ERC-20 support, publishes its Alto implementation, and underwent a scoped independent security assessment. These are limited favorable capability and validation signals, but the packet contains no comparative benchmark or evidence that alternatives cannot replicate them.
    acknowledgedContradictionIds: []
    evidenceGapNote: Independent comparative product assessment and durable technical advantage were not established.
  - criterionId: defensibility_security_and_network_effects
    applicability: applicable
    rawAnchor: 55
    coverage: 0.5
    citedEvidenceClaimIds: [clm-pimlico-audit, clm-pimlico-safe-integration, clm-pimlico-open-source]
    rationale: Nethermind completed a scoped security assessment and Safe confirms ecosystem embedment, providing limited favorable security and workflow evidence. The open-source bundler and absence of switching-cost, concentration, or network-effect data limit any durability conclusion.
    acknowledgedContradictionIds: []
    evidenceGapNote: Cutoff-date audit coverage, switching costs, customer retention, participant concentration, and network effects were not established.
