analystNote: PLUME supply, launch, and company-reported TVL/activity are not treated as proof of value capture, durability, or independently verified adoption.
criterionJudgments:
  - { criterionId: observable_scale_vs_capital, applicability: applicable, rawAnchor: 60, coverage: 0.5, citedEvidenceClaimIds: [clm-plume-series-a, clm-plume-q2-metrics], rationale: "The completed company financing history and contemporaneous reported address and transaction scale together support a limited favorable scale-versus-capital judgment. TVL is not treated as company capital or output, and the operating metrics remain company reported.", acknowledgedContradictionIds: [], evidenceGapNote: "The packet does not establish actual capital consumed, full deployment of primary proceeds, independently verified usage quality, revenue, or a comparable efficiency ratio." }
  - { criterionId: operating_resource_intensity, applicability: applicable, rawAnchor: 50, coverage: 0, citedEvidenceClaimIds: [], rationale: "No recurring validator, incentive, liquidity, or operating-cost evidence is admitted.", acknowledgedContradictionIds: [], evidenceGapNote: "Need operating, incentive, and ecosystem-spend evidence." }
  - { criterionId: adoption_and_usage_momentum, applicability: applicable, rawAnchor: 50, coverage: 0, citedEvidenceClaimIds: [], rationale: "Mainnet launch, genesis capital put onchain, and one later TVL, address, and transaction snapshot do not form a comparable multi-period series or establish growing and persistent organic usage.", acknowledgedContradictionIds: [], evidenceGapNote: "Need comparable multi-period active-user, transaction-quality, workload, fee, retention, and incentive-adjusted usage evidence." }
  - { criterionId: developer_and_ecosystem_momentum, applicability: applicable, rawAnchor: 50, coverage: 0, citedEvidenceClaimIds: [], rationale: "No developer, contributor, or live third-party application-growth evidence is provided.", acknowledgedContradictionIds: [], evidenceGapNote: "Need dated developer and production-application evidence." }
  - { criterionId: team_execution_credibility, applicability: applicable, rawAnchor: 55, coverage: 0.5, citedEvidenceClaimIds: [clm-plume-mainnet-genesis], rationale: "Plume's company-reported press release states that public mainnet Genesis launched, providing limited favorable evidence of team-level execution. Founder identities alone add no execution merit, and the delivery or subsequent operating outcomes are not independently verified here.", acknowledgedContradictionIds: [], evidenceGapNote: "Need independent confirmation of the company-reported mainnet delivery, sourced individual backgrounds, role continuity, prior execution records, and subsequent operating outcomes." }
  - { criterionId: governance_and_incentive_alignment, applicability: applicable, rawAnchor: 50, coverage: 0.5, citedEvidenceClaimIds: [clm-plume-tokenomics], rationale: "The reported allocation describes token distribution, while foundation and control rights remain unresolved; it supports no directional alignment conclusion.", acknowledgedContradictionIds: [], evidenceGapNote: "Need governance, foundation control, unlock execution, and ownership-rights evidence." }
  - { criterionId: problem_urgency_and_market_depth, applicability: applicable, rawAnchor: 50, coverage: 0, citedEvidenceClaimIds: [], rationale: "An RWAfi focus alone does not establish paid urgency, market depth, or customer budgets.", acknowledgedContradictionIds: [], evidenceGapNote: "Need asset-originator, user, and paid-demand evidence." }
