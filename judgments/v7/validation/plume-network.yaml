  - { criterionId: economic_sustainability, applicability: applicable, rawAnchor: 50, coverage: 0, citedEvidenceClaimIds: [], rationale: "Reported TVL and transactions do not establish revenue, subsidy dependence, or sustainable margins.", acknowledgedContradictionIds: [], evidenceGapNote: "Need fee, incentive, operating-cost, and contribution-economics evidence." }
  - { criterionId: distribution_and_integration_pull, applicability: applicable, rawAnchor: 50, coverage: 0, citedEvidenceClaimIds: [], rationale: "Reported TVL, addresses, and transactions are activity totals and do not identify a functioning acquisition channel, production integration pull, or repeatable distribution motion.", acknowledgedContradictionIds: [], evidenceGapNote: "Need production partner and asset-originator integrations, acquisition channels, referral or composability pull, and evidence of repeatability." }
