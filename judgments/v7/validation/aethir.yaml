analystNote: Operating company, network, ATH, node system, and foundation are kept distinct; reported revenue and GPU-scale figures remain unaudited company disclosures.
criterionJudgments:
  - { criterionId: observable_scale_vs_capital, applicability: applicable, rawAnchor: 50, coverage: 0, citedEvidenceClaimIds: [], rationale: "Reported revenue and GPU-container scale do not establish scale relative to permitted primary-company capital because the disclosed financing does not resolve its primary, secondary, or token-rights mix.", acknowledgedContradictionIds: [], evidenceGapNote: "Need permitted primary-company capital, actual capital consumed, and independently verified operating-scale evidence." }
  - { criterionId: operating_resource_intensity, applicability: applicable, rawAnchor: 50, coverage: 0.5, citedEvidenceClaimIds: [clm-aethir-2025-revenue-scale], rationale: "The company-reported distributed GPU footprint provides limited evidence of a substantial infrastructure resource footprint, but does not establish whether operating resource intensity is favorable or adverse without cost, utilization, operating-burden, capital-burden, or subsidy-dependence evidence.", acknowledgedContradictionIds: [], evidenceGapNote: "Need GPU supplier payouts, utilization, capacity costs, operating burden, capital burden, subsidy dependence, and incentive evidence." }
  - { criterionId: adoption_and_usage_momentum, applicability: applicable, rawAnchor: 50, coverage: 0, citedEvidenceClaimIds: [], rationale: "The 2024 ARR disclosure and 2025 annual revenue booked through the protocol use unresolved accounting definitions and periods, so they do not form a comparable usage or revenue-momentum series.", acknowledgedContradictionIds: [], evidenceGapNote: "Need comparable multi-period recognized revenue, workloads, active customers, and retained-cohort evidence, with booked, net, and token-denominated amounts reconciled." }
  - { criterionId: developer_and_ecosystem_momentum, applicability: applicable, rawAnchor: 50, coverage: 0, citedEvidenceClaimIds: [], rationale: "No developer, contributor, or third-party ecosystem-growth evidence is admitted.", acknowledgedContradictionIds: [], evidenceGapNote: "Need dated developer, workload-partner, and contributor evidence." }
  - { criterionId: team_execution_credibility, applicability: applicable, rawAnchor: 55, coverage: 0.5, citedEvidenceClaimIds: [clm-aethir-mainnet-ath], rationale: "Leadership identities and titles provide context only and no execution merit. Aethir's first-party mainnet announcement provides the limited favorable evidence of team-level shipped work, but the delivery is not independently verified here.", acknowledgedContradictionIds: [], evidenceGapNote: "Need independent confirmation of the company-reported mainnet delivery, independently sourced individual backgrounds, role continuity, and subsequent operating outcomes." }
  - { criterionId: governance_and_incentive_alignment, applicability: applicable, rawAnchor: 50, coverage: 0.5, citedEvidenceClaimIds: [clm-aethir-checker-node-supply], rationale: "The four-year allocation of 15% of ATH supply to Checker Node rewards provides limited incentive-structure evidence, but its alignment direction cannot be determined from license distribution or allocation terms alone.", acknowledgedContradictionIds: [], evidenceGapNote: "Need governance and key-control rights, ownership and vesting detail, reward performance conditions, and accountable company-network-foundation control evidence." }
  - { criterionId: problem_urgency_and_market_depth, applicability: applicable, rawAnchor: 55, coverage: 0.5, citedEvidenceClaimIds: [clm-aethir-2024-arr], rationale: "Company-reported recurring revenue from GPU solutions is limited evidence of paid demand, but does not independently establish market depth.", acknowledgedContradictionIds: [], evidenceGapNote: "Need independent customer, workload, pricing, and market-demand evidence." }
  - { criterionId: structural_and_regulatory_fit, applicability: applicable, rawAnchor: 50, coverage: 0, citedEvidenceClaimIds: [], rationale: "The Panama-foundation clue does not establish the relevant regulatory or jurisdictional posture.", acknowledgedContradictionIds: [], evidenceGapNote: "Need operating-company, foundation, token, and compute-service regulatory evidence." }
  - { criterionId: value_capture_model, applicability: applicable, rawAnchor: 55, coverage: 0.5, citedEvidenceClaimIds: [clm-aethir-2024-arr, clm-aethir-2025-revenue-scale], rationale: "Company-reported recurring revenue and revenue booked through the protocol provide limited favorable evidence of a repeat monetization path for GPU services. They do not establish retained fees, revenue ownership, ATH accrual, or which legal entity captures the value.", acknowledgedContradictionIds: [], evidenceGapNote: "Need audited fee flows, recognized and retained revenue, pricing, token-accrual mechanics, and company-versus-network ownership of monetization." }
  - { criterionId: economic_sustainability, applicability: applicable, rawAnchor: 50, coverage: 0.5, citedEvidenceClaimIds: [clm-aethir-2025-revenue-scale], rationale: "The company-reported revenue figure is insufficient to establish sustainable contribution economics after GPU and incentive costs.", acknowledgedContradictionIds: [], evidenceGapNote: "Need audited revenue, supplier payouts, incentives, margins, and cash-flow evidence." }
  - { criterionId: distribution_and_integration_pull, applicability: applicable, rawAnchor: 50, coverage: 0, citedEvidenceClaimIds: [], rationale: "No evidence identifies repeatable customer acquisition, production integrations, or referral pull.", acknowledgedContradictionIds: [], evidenceGapNote: "Need customer acquisition, workload integration, and expansion evidence." }
  - { criterionId: adoption_friction_and_ecosystem_access, applicability: applicable, rawAnchor: 50, coverage: 0.5, citedEvidenceClaimIds: [clm-aethir-mainnet-ath, clm-aethir-dci-foundation-filing], rationale: "The disclosures identify ATH-mediated rental, staking, validation, and incentive roles, providing limited workflow context but no evidence that customers must stake or that these roles improve or worsen onboarding.", acknowledgedContradictionIds: [], evidenceGapNote: "Need actual customer onboarding steps, billing and token-procurement requirements, integration time, compliance burden, and observed production friction." }
  - { criterionId: technical_and_product_differentiation, applicability: applicable, rawAnchor: 50, coverage: 0, citedEvidenceClaimIds: [], rationale: "Mainnet and token launch facts, GPU-container counts, locations, and reported revenue do not establish a differentiating technical mechanism or capability relative to alternatives.", acknowledgedContradictionIds: [], evidenceGapNote: "Need criterion-specific architecture, capability, benchmark, security, cost, reliability, or comparative-alternative evidence." }
  - { criterionId: defensibility_security_and_network_effects, applicability: applicable, rawAnchor: 50, coverage: 0, citedEvidenceClaimIds: [], rationale: "ATH supply and Checker Node distribution do not establish active supply quality, security, durable network effects, or switching costs.", acknowledgedContradictionIds: [], evidenceGapNote: "Need active node performance, audit, retention, and concentration evidence." }
