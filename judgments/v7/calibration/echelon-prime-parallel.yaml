criterionJudgments:
  - criterionId: observable_scale_vs_capital
    applicability: applicable
    rawAnchor: 50
    coverage: 0
    citedEvidenceClaimIds: [clm-echelon-seriesb-35m]
    rationale: >-
      Primary capital consumed is well-corroborated: a $50M Series A (2021)
      and a $35M Series B (2024), roughly $85M cumulative equity funding,
      plus a separate PRIME TGE. No admissible adoption/usage metric exists
      (gap-echelon-adoption-metrics): the only historical scale figure, 2021
      NFT primary-sale volume, is stale and pre-dates the game's actual
      playable release, so it was not encoded as a current-scale metric. With
      no current scale evidence, no ratio to capital consumed can be
      responsibly judged.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      No current player/retention/marketplace-volume metric exists
      (gap-echelon-adoption-metrics).
  - criterionId: operating_resource_intensity
    applicability: applicable
    rawAnchor: 40
    coverage: 0.5
    citedEvidenceClaimIds: [clm-echelon-esports-3m]
    rationale: >-
      The Foundation committed $3M in esports prize funding for 2025
      (Seasons 2-3), a 6x increase over the Season 1 pool, a concrete,
      recurring foundation-funded subsidy to drive engagement. This is one
      real data point suggesting the ecosystem's engagement model currently
      leans on continued foundation-funded incentive spend rather than
      organic, self-sustaining participation; no claim quantifies compute,
      hosting, or other operating costs beyond this single subsidy category.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      No compute/infrastructure cost evidence exists; only one incentive-
      subsidy category (esports prizes) is documented.
  - criterionId: adoption_and_usage_momentum
    applicability: applicable
    rawAnchor: 50
    coverage: 0
    citedEvidenceClaimIds: []
    rationale: >-
      The only 2025 product-status source explicitly documents development
      progress (a matchmaking-system overhaul, mobile-device stability
      testing, a scheduled card-set expansion), not adoption; it carries no
      player-count, retention, or transaction data. No claim establishes
      real, persisting usage growth (gap-echelon-adoption-metrics).
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      No player-count, retention, or usage-growth evidence exists
      (gap-echelon-adoption-metrics).
  - criterionId: developer_and_ecosystem_momentum
    applicability: applicable
    rawAnchor: 50
    coverage: 0.5
    citedEvidenceClaimIds: [clm-echelon-beezie-partnership]
    rationale: >-
      A March 2026 partnership with Beezie (on-chain graded trading-card
      raffles) is a real disclosed third-party integration, but it is
      sourced only to Echelon's own official social account, with no
      independent journalism, analytics, or on-chain corroboration of scope
      or actual usage. One first-party-only instance does not establish a
      pattern of growing, staying-live third-party integrations.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      No independent corroboration of the Beezie partnership's scope or
      usage exists; no second integration example exists in the frozen
      packet.
  - criterionId: team_execution_credibility
    applicability: applicable
    rawAnchor: 55
    coverage: 0.5
    citedEvidenceClaimIds: [clm-echelon-founders-roles, clm-echelon-2025-product-progress]
    rationale: >-
      Founder identity and titles (Mojtahedi as CEO, Haldenby as CTO) rest
      on a single third-party analytical source with no independent
      corroboration and no prior-company/background data (priorCompanies is
      empty for both), so no track-record-based judgment is possible from
      biography alone. What is observable is continued, multi-year shipped
      output under the same leadership since 2021: two institutional
      funding rounds, a live open-beta game client, an operating esports
      league, and incremental 2025 engineering progress (matchmaking
      overhaul, mobile stability work), which is evidence of sustained
      execution even absent detailed personal-background sourcing.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      Founder identity rests on a single source with no independent
      corroboration and no prior-company/background detail.
  - criterionId: governance_and_incentive_alignment
    applicability: applicable
    rawAnchor: 50
    coverage: 0.5
    citedEvidenceClaimIds: [clm-echelon-governance-structure, clm-echelon-prime-tge]
    rationale: >-
      An elected governing body (Emissaries Prime, first 11 members elected
      February 2022) is described as functioning like a corporate board, a
      real accountability mechanism on paper, but its current membership and
      demonstrated activity as of the cutoff is unverified (single source,
      2025 publication describing a 2022 structure). Separately, PRIME's
      initial allocation gave roughly 16.24% to investors and a comparable
      share to the founding team, a disclosed but not clearly excessive
      concentration absent total-supply/vesting-schedule context. Neither
      fact alone supports a clearly favorable or unfavorable lean.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      Emissaries Prime's current membership and activity level as of the
      cutoff is unverified; full vesting-schedule/total-supply context for
      the initial PRIME allocation is not established.
