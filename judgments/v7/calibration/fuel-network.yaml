  - criterionId: team_execution_credibility
    applicability: applicable
    rawAnchor: 55
    coverage: 0.5
    citedEvidenceClaimIds: [clm-fuel-ignition-mainnet]
    rationale: >-
      Founders Nick Dodson and John Adler are named and sourced, but the
      packet records no prior-company history or education for either
      (empty priorCompanies/education). The clearest direct execution
      evidence is that the team shipped a live, functioning mainnet
      (Fuel Ignition, October 2024), which is real delivered work rather
      than a roadmap claim, though it does not establish individual
      pedigree.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      No prior-company track record or education background is
      established for either founder (see gap-fuel-legal-entity for
      related entity-identity gaps).
  - criterionId: governance_and_incentive_alignment
    applicability: applicable
    rawAnchor: 20
    coverage: 1
    citedEvidenceClaimIds: [clm-fuel-security-council-reduction, clm-fuel-bridge-pause-2026]
    rationale: >-
      The Fuel Security Council multisig, which can upgrade bridge
      contracts with no timelock, was reduced across 2025-2026 from
      9-of-12 down to 4-of-6 by removing four members, and the official
      bridge was paused for eight days in July 2026 with no public
      explanation found by an independent monitor (L2BEAT). Both are
      independently sourced, dated, on-chain/monitor-derived facts about
      control concentration and disclosure, not allegations. Together they
      indicate weak accountability over an instrument with unilateral,
      no-timelock upgrade power.
    acknowledgedContradictionIds: []
    evidenceGapNote: null
