  - criterionId: observable_scale_vs_capital
    applicability: applicable
    rawAnchor: 50
    coverage: 0
    citedEvidenceClaimIds: [clm-fuel-funding-80m]
    rationale: >-
      The frozen packet establishes primary capital consumed ($80M raised
      September 2022) but no independently sourced scale evidence (TVL,
      transaction volume, active addresses, or protocol fees) exists to
      compare against it. Capital is known; scale is not, so the ratio
      cannot be responsibly judged from either direction.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      No network/product scale metric is present in the frozen packet
      (see gap-fuel-network-metrics); coverage set to 0 rather than
      inferring scale from capital or product existence alone.
