  - criterionId: technical_and_product_differentiation
    applicability: applicable
    rawAnchor: 55
    coverage: 0.5
    citedEvidenceClaimIds: [clm-fuel-ignition-mainnet]
    rationale: >-
      Independent journalism (The Block) reports that Fuel Ignition
