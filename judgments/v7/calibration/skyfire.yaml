criterionJudgments:
  - criterionId: observable_scale_vs_capital
    applicability: applicable
    rawAnchor: 50
    coverage: 0
    citedEvidenceClaimIds: [clm-skyfire-followon-total-95m]
    rationale: >-
      Primary capital consumed is well-corroborated ($9.5M total seed across
      two tranches, independently reported by two outlets). No scale metric
      exists in the frozen packet (digitalAssetMetrics is null;
      gap-skyfire-quantified-traction: no transaction volume, active-agent
      count, or revenue figure was found for any date), so no scale-to-capital
      ratio can be responsibly judged.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      No quantified scale/usage metric exists in the frozen packet
      (gap-skyfire-quantified-traction).
