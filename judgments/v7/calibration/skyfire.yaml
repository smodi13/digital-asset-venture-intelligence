  - criterionId: adoption_and_usage_momentum
    applicability: applicable
    rawAnchor: 50
    coverage: 0.5
    citedEvidenceClaimIds: [clm-skyfire-early-customers, clm-skyfire-kyapay-launch]
    rationale: >-
      Named early users exist (Denso, Payman at Aug 2024 launch; ~30 KYAPay
      launch partners reported by PYMNTS in July 2025), but both are recorded
      as evidenceStatus: insufficient: the launch customers were design
      partners with no measured usage depth, and the partner count is a
      company-supplied figure with no confirmation of how many reached live
      production use. No transaction volume, active-agent count, or growth
      trend exists to establish persistence rather than a point-in-time
      announcement.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      No quantified or time-series usage evidence exists
      (gap-skyfire-quantified-traction); production status of named
      customers/partners is unconfirmed.
  - criterionId: developer_and_ecosystem_momentum
    applicability: applicable
    rawAnchor: 55
    coverage: 0.5
    citedEvidenceClaimIds: [clm-skyfire-f5-partnership]
    rationale: >-
      F5, Inc. (a NASDAQ-listed enterprise-security vendor) independently
      announced, on its own investor newsroom, a partnership to integrate
      Skyfire's KYA protocol into its Bot Defense platform, materially
      stronger provenance than a self-reported partnership. This is one
      concrete third-party integration, but a single instance does not
      establish a "growing" pattern of live integrations, and the stated
      April 2026 integration-availability date was not independently
      confirmed as reached by the cutoff.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      No confirmation the F5 integration went live as scheduled, and no
      second independently-corroborated integration exists in the frozen
      packet.
  - criterionId: team_execution_credibility
    applicability: applicable
    rawAnchor: 60
    coverage: 1
    citedEvidenceClaimIds: [clm-skyfire-founders]
    rationale: >-
      Both co-founders are sourced with directly relevant shipped
      backgrounds: Sarhangi previously founded and led Jibe Mobile to a
      2015 acquisition by Google and held a VP of Products role at Ripple;
      DeWitt held an executive role at Ripple. The Ripple payments
      background is directly relevant to Skyfire's payment-infrastructure
      product, and Sarhangi has a demonstrated prior founder exit, not
      prestige alone. The team has also shipped a public product launch, a
      follow-on protocol (KYAPay), and an independently-corroborated
      enterprise partnership, evidencing continued execution.
    acknowledgedContradictionIds: []
    evidenceGapNote: null
