  - criterionId: problem_urgency_and_market_depth
    applicability: applicable
    rawAnchor: 55
    coverage: 0.5
    citedEvidenceClaimIds: [clm-skyfire-f5-partnership]
    rationale: >-
      A publicly-traded enterprise-security vendor investing in a bot-defense
      integration specifically to distinguish legitimate AI-agent traffic is
      evidence of real, funded problem urgency (an integration that cost F5
      engineering effort to build, not a marketing mention). This is one
      well-corroborated instance; no second independent example of
      funded/costly integration exists, and no source quantifies addressable
      market depth.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      No claim quantifies addressable market depth or a second independent
      instance of funded integration demand.
