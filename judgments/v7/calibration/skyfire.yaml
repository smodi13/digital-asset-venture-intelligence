  - criterionId: value_capture_model
    applicability: applicable
    rawAnchor: 55
    coverage: 0.5
    citedEvidenceClaimIds: [clm-skyfire-product-mechanics]
    rationale: >-
      A concrete recurring monetization mechanism is disclosed: a 2-3%
      transaction fee on agent payments, with potential future
      verification-service revenue. This is a real designed fee/take-rate
      path, not a token buyback or vanity metric. However, the disclosure
      dates to the August 2024 launch and no later source confirmed the fee
      structure (or any realized revenue from it) as unchanged through the
      cutoff.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      No source confirms the fee structure or realized transaction-fee
      revenue as of a date closer to the cutoff.
  - criterionId: economic_sustainability
    applicability: applicable
    rawAnchor: 50
    coverage: 0.5
    citedEvidenceClaimIds: [clm-skyfire-followon-total-95m]
    rationale: >-
      No funding round was found after the October 2024 $9.5M seed total,
      despite continued product launches (KYAPay mid-2025) and a partnership
      (F5, March 2026) roughly a year and a half later
      (gap-skyfire-funding-since-2024). This is genuinely ambiguous: it could
      reflect transaction-fee revenue sufficient to avoid raising, an
      undisclosed round, or a funding gap; no evidence in the frozen packet
      resolves which.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      No evidence resolves whether continued operation past the seed round
      reflects revenue sufficiency, undisclosed capital, or funding strain
      (gap-skyfire-funding-since-2024).
  - criterionId: distribution_and_integration_pull
    applicability: applicable
    rawAnchor: 50
    coverage: 0.5
    citedEvidenceClaimIds: [clm-skyfire-kyapay-launch, clm-skyfire-f5-partnership]
    rationale: >-
      KYAPay's SDK is reported as integrable "in as little as 15 minutes,"
      with roughly 30 launch partners, a developer self-serve motion signal;
      separately the F5 partnership is one instance of an inbound enterprise
      channel. Both signals are real but unconfirmed at production depth: the
      partner count is company-supplied and not verified as live, and F5 is a
      single instance, not a demonstrated repeatable pattern.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      No confirmation of how many launch partners reached live production
      use, and no second independent enterprise-channel example exists.
  - criterionId: adoption_friction_and_ecosystem_access
    applicability: applicable
    rawAnchor: 55
    coverage: 0.5
    citedEvidenceClaimIds: [clm-skyfire-kyapay-launch]
    rationale: >-
      PYMNTS reported KYAPay SDK integration as achievable "in as little as
      15 minutes," a concrete low-friction claim. This is a company-supplied
      figure relayed by an independent outlet, not independently timed or
      verified across the ~30 named partners, so it is treated as a modest
      positive signal rather than confirmed friction data.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      The stated integration time is unverified across partners; no
      compliance/wallet-UX friction evidence exists for end users of agent
      wallets.
