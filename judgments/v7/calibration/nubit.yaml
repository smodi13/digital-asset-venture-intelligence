      subsidy needs for Nubit's infrastructure.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      No operating-cost or resource-intensity evidence exists in the frozen
      packet.
  - criterionId: adoption_and_usage_momentum
    applicability: applicable
    rawAnchor: 50
    coverage: 0
    citedEvidenceClaimIds: []
    rationale: >-
      No usage, transaction, or retained-workload evidence exists. The
      packet's own researcher notes explicitly excluded a sponsored,
      company-adjacent claim of "4 million transactions / 267,000 users"
      because it is not independent reporting and cannot be attributed
      specifically to Nubit rather than the broader Thunderbolt initiative;
      it is not cited here as adoption evidence.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      Public sources describe only a pre-alpha/alpha testnet as of the
      research cutoff (gap-nubit-mainnet-status); no independent usage
      metric exists.
