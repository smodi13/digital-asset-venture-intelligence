criterionJudgments:
  - criterionId: observable_scale_vs_capital
    applicability: applicable
    rawAnchor: 50
    coverage: 0
    citedEvidenceClaimIds: [clm-nubit-preseed, clm-nubit-seed]
    rationale: >-
      Primary capital consumed is documented ($3M pre-seed plus $8M seed,
      both company-sourced only, no independent corroboration per
      gap-nubit-independent-corroboration), but no scale evidence exists:
      the packet cannot establish whether Nubit reached mainnet (see
      gap-nubit-mainnet-status) and records no TVL, transaction, or user
      figures. The scale side of the ratio is entirely absent.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      No product/network scale evidence exists; mainnet launch status is
      itself unconfirmed (gap-nubit-mainnet-status).
  - criterionId: operating_resource_intensity
