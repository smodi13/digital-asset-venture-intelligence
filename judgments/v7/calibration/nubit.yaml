  - criterionId: technical_and_product_differentiation
    applicability: applicable
    rawAnchor: 35
    coverage: 0.5
    citedEvidenceClaimIds: [clm-nubit-thunderbolt-pivot]
    rationale: >-
      The sole technical-differentiation evidence is Nubit's own
      announcement of "Bitcoin Thunderbolt," a claimed Bitcoin base-layer
      soft-fork it says it co-developed. This is entirely company-sourced
      (tier c, reliability 0.4, non-independent) and, per the packet's own
      notes, was not independently verified against any Bitcoin Core / BIP
      proposal channel; a base-layer soft-fork is a change that requires
      Bitcoin Core consensus and cannot be unilaterally shipped by one
      company, which further weakens the claim's credibility as evidence
      of differentiation rather than aspiration.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      No independent technical assessment or confirmation within a
      recognized Bitcoin Core process exists for the Thunderbolt claims.
