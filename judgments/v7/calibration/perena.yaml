      Anna Yuan is independently reported (CoinDesk) as founder, with a
      directly problem-relevant prior role leading stablecoin initiatives
      at the Solana Foundation, not merely a prestigious but unrelated
      affiliation. The team shipped a live protocol (Numeraire, mainnet
