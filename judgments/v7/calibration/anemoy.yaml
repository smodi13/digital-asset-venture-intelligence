  - criterionId: governance_and_incentive_alignment
    applicability: applicable
    rawAnchor: 32
    coverage: 1
    citedEvidenceClaimIds: [clm-anemoy-governance-value-capture-question]
    rationale: >-
      A dated, public Centrifuge governance-forum thread explicitly and,
      as of the last visible reply, unsuccessfully asked whether the
      Centrifuge Network Foundation holds equity in Anemoy and whether
      CFG token holders have any economic claim on Anemoy's revenue,
      framed directly against a Centrifuge governance proposal asserting
      CFG as the protocol's "single value accrual mechanism." This is a
      real, unresolved accountability/alignment gap between the entity
      that captures revenue from Centrifuge-enabled tokenized funds and
      the token holders of the protocol that enables them. This is a
      single community-member question, not a confirmed governance
      finding, which keeps this from being scored lower still, but the
      question itself remains genuinely open.
    acknowledgedContradictionIds: []
    evidenceGapNote: null
