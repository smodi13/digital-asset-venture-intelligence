  - criterionId: defensibility_security_and_network_effects
    applicability: applicable
    rawAnchor: 40
    coverage: 0.5
    citedEvidenceClaimIds: [clm-anemoy-governance-value-capture-question]
    rationale: >-
      Anemoy's tokenization infrastructure depends entirely on the
      Centrifuge protocol, and the unresolved public question over
      whether Centrifuge Network Foundation holds equity in Anemoy or
      whether CFG holders have any claim on its revenue leaves the
      economic terms of that platform dependency genuinely undocumented.
      An unresolved dependency on a single external protocol/brand
      relationship, with no established economic or governance terms
      between the two, is a real counterparty/platform-concentration
      exposure for Anemoy's own defensibility, tempered by the fact that
      both flagship products have shipped and operate today regardless of
      how that question is eventually resolved.
