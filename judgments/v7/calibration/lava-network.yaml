  - criterionId: defensibility_security_and_network_effects
    applicability: applicable
    rawAnchor: 40
    coverage: 0.5
    citedEvidenceClaimIds: [clm-lava-foundation-control]
    rationale: >-
      The same centralized-control fact relevant to governance (Foundation
      as sole controller of token sales and roadmap, transition to DAO
      unconfirmed) also bears on durability: concentrated control is a
      structural weakness for a network effect thesis premised on
      decentralization. No claim documents validator/provider-base size,
      audit history, or liquidity/retention data that would offset this.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
