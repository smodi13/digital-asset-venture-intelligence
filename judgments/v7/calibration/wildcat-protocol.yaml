  - criterionId: team_execution_credibility
    applicability: applicable
    rawAnchor: 68
    coverage: 1
    citedEvidenceClaimIds: [clm-wildcat-seed-extension, clm-wildcat-kinto-default, clm-wildcat-audit-code4rena]
    rationale: >-
      Laurence Day (CEO) and Dillon Kellar (co-founder, previously at
      Indexed Finance, a directly relevant prior DeFi protocol) are named
      and sourced by independent journalism. The team raised three rounds
      from credible funds (Robot Ventures, Wintermute Ventures, Polygon
      Ventures, among others) across 2023-2025, shipped and operated a
      live undercollateralized-lending protocol that originated $368
      million since 2023, commissioned an independent third-party audit
      prior to relying on the design at scale, and navigated the
      protocol's first borrower default with reporting indicating losses
      stayed contained to the affected market. This is demonstrated
      execution under real operating stress, not merely credentialing.
    acknowledgedContradictionIds: []
    evidenceGapNote: null
