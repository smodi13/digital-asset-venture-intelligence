  - criterionId: technical_and_product_differentiation
    applicability: applicable
    rawAnchor: 52
    coverage: 0.5
    citedEvidenceClaimIds: [clm-wildcat-audit-code4rena]
    rationale: >-
      An independent, third-party competitive audit (Code4rena) was
      conducted on the Wildcat smart-contract system, yielding 9 findings
      including one rated HIGH severity, which is exactly the kind of
      independently assessed evidence the criterion calls for rather than
      a self-benchmark. Whether the HIGH-severity finding was remediated
      before mainnet launch was not established, which tempers how far
      this can be credited toward differentiation confidence.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      Remediation status of the HIGH-severity Code4rena finding prior to
      mainnet launch was not established.
  - criterionId: defensibility_security_and_network_effects
    applicability: applicable
    rawAnchor: 48
    coverage: 1
    citedEvidenceClaimIds: [clm-wildcat-audit-code4rena, clm-wildcat-kinto-default]
    rationale: >-
      Two distinct, relevant facts pull in different directions. The
      Code4rena audit found one HIGH-severity issue whose remediation
      status is unconfirmed, a real security-posture gap. Separately, the
      Kinto default was an exploit that occurred upstream at the borrower
      Kinto itself, draining Kinto's own pools -- it is not a Wildcat
      smart-contract exploit, and this packet does not treat it as one.
      What is directly relevant to Wildcat's own defensibility is that its
      per-market, borrower-isolated design appears (per reporting) to have
      contained the resulting default's losses to the single affected
      market rather than letting it cascade protocol-wide, which is
      evidence the risk-isolation architecture functioned as designed
      under a real stress event. No claim documents validator/lender-base
      size or observed resistance to forks that would further support a
      network-effects judgment either way.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      No validator/lender-base-size or fork-resistance evidence exists;
      final confirmation that losses remained fully isolated to the
      Phoenix Facility market was not established
      (gap-wildcat-final-kinto-recovery).
