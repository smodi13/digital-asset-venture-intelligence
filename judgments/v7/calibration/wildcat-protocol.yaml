criterionJudgments:
  - criterionId: observable_scale_vs_capital
    applicability: applicable
    rawAnchor: 62
    coverage: 1
    citedEvidenceClaimIds: [clm-wildcat-seed-extension, clm-wildcat-kinto-default]
    rationale: >-
      Total disclosed primary capital raised to date is $5.3 million
      (pre-seed, seed, and seed-extension combined). Against that, the
      protocol had originated $368 million in credit since its 2023
      launch and carried $150+ million outstanding as of the September
      2025 report -- a figure disclosed incidentally in independent
      reporting of a borrower default, not in a marketing context, which
      supports its reliability. This is a genuinely large operating-scale
      figure relative to capital consumed, though it is a cumulative
      origination total rather than a current, verified TVL, and the same
      report shows the protocol experiencing a real default within that
      book.
    acknowledgedContradictionIds: []
    evidenceGapNote: null
