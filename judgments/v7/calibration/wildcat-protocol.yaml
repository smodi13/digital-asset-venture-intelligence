  - criterionId: economic_sustainability
    applicability: applicable
    rawAnchor: 42
    coverage: 1
    citedEvidenceClaimIds: [clm-wildcat-kinto-default]
    rationale: >-
      A real borrower default occurred (Kinto/Phoenix Facility, September
      2025), with Phoenix lenders facing a partial principal loss
      (expected ~76% recovery, final realized recovery not established).
      This is direct evidence that the lending model's loss-absorption
      relies on the affected market's own reserves rather than a system-
      wide backstop. Reporting indicates the loss stayed contained to the
      one affected market rather than propagating protocol-wide, which is
      a point in favor of the isolation design, but a real, unresolved
      capital loss to a class of lenders on the platform is itself a
      negative economic-sustainability data point for that market.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      Final realized recovery for Phoenix lenders was not established
      (gap-wildcat-final-kinto-recovery).
