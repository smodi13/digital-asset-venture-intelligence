  - criterionId: team_execution_credibility
    applicability: applicable
    rawAnchor: 65
    coverage: 0.5
    citedEvidenceClaimIds: [clm-nillion-mainnet-tge, clm-nillion-ethereum-migration-2026]
    rationale: >-
      The founding team is named and sourced with prior-company
      affiliations (Hedera, Goldman Sachs, Reserve) recorded in the
      packet's people data, but per criterion definition prestige alone
      contributes zero, so the anchor rests instead on demonstrated
      delivery: the team shipped a public mainnet and TGE (independently
      corroborated by a Messari research report, not only the company's
      own release) and later executed a material architecture migration
      from a Cosmos-based chain to Ethereum, independently confirmed as
      operationally real by an exchange (Kraken) rather than resting
      solely on Nillion's own framing.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      No claim documents specifically what each founder built or achieved
      at their named prior companies; only affiliation, not accomplishment,
      is sourced.
  - criterionId: governance_and_incentive_alignment
    applicability: applicable
    rawAnchor: 35
    coverage: 1
    citedEvidenceClaimIds: [clm-nillion-insider-allocation, clm-nillion-mm-crash-2025]
    rationale: >-
      Published tokenomics allocate roughly 41% of total NIL supply to
      insiders (21% Early Backers, 20% Core Contributors), a material
      concentration fact from an independent third-party estimate
      (Messari). Separately, in November 2025 a market maker sold a large
      quantity of NIL without authorization, per Nillion's own account,
      crashing the price roughly 50%; whether or not the counterparty was
      ultimately at fault, the episode demonstrates that a large,
      uncontrolled token sale by a market-facing counterparty was
      possible, which bears on the adequacy of treasury/market-access
      controls. The legal relationship between the operating company, the
      "Nillion Association," and the token treasury is also not clearly
      established (gap-nillion-legal-entity), compounding the
      accountability picture.
    acknowledgedContradictionIds: []
    evidenceGapNote: null
  - criterionId: problem_urgency_and_market_depth
    applicability: applicable
