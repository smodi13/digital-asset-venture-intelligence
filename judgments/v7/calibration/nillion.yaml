  - criterionId: observable_scale_vs_capital
    applicability: applicable
    rawAnchor: 50
    coverage: 0
    citedEvidenceClaimIds: [clm-nillion-seriesA-25m]
    rationale: >-
      Primary capital consumed is well-corroborated ($25M in the most
      recent disclosed round; $45M cumulative across two rounds is a
      secondary aggregate, not independently itemized). No scale evidence
      (TVL, transaction volume, active node/operator counts) exists in the
      frozen packet despite a live mainnet, so no ratio can be responsibly
      judged.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
