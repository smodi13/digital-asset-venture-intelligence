  - criterionId: adoption_friction_and_ecosystem_access
    applicability: applicable
    rawAnchor: 45
    coverage: 0.5
    citedEvidenceClaimIds: [clm-nillion-ethereum-migration-2026]
    rationale: >-
      Operating a "Blacklight" verification node under the Nillion 2.0
      design requires staking 70,000 NIL, a concrete, quantified capital
      barrier to that specific participation role. This is real friction
      evidence for node operators, though it says nothing about end-user
      onboarding friction (wallet UX, compliance, liquidity access).
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      No end-user-facing friction evidence (wallet UX, compliance,
      liquidity access) exists; only node-operator capital friction is
      documented.
  - criterionId: technical_and_product_differentiation
    applicability: applicable
    rawAnchor: 50
    coverage: 0
    citedEvidenceClaimIds: []
    rationale: >-
      No claim in the frozen packet independently assesses the MPC-based
      "blind computation" architecture's performance, security, or
      differentiation versus alternative privacy-infrastructure designs.
      Messari's independent report corroborates the mainnet/TGE timeline
      and supply figures, not a technical differentiation assessment, so
      it is not cited here as differentiation evidence.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      No independent technical assessment or benchmark of the MPC
      architecture exists in the frozen packet.
  - criterionId: defensibility_security_and_network_effects
    applicability: applicable
    rawAnchor: 30
    coverage: 1
    citedEvidenceClaimIds: [clm-nillion-mm-crash-2025]
    rationale: >-
      No confirmed, admissible-standard security audit exists for either
      the NIL token contract or the core MPC network contracts
      (gap-nillion-audit-scope: secondary sources mention a Quantstamp
      audit but no dated, admissible source was found). Separately, a
      large, uncontrolled NIL token sale by a market-facing counterparty
      occurred in November 2025, causing a roughly 50% price crash; this
      is direct evidence of a real access/market-control weakness at that
      point in the network's history, regardless of how the "unauthorized"
      characterization is ultimately resolved. No claim documents a
      validator/node-operator base size or observed resistance to forks
      that would offset this.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      No confirmed audit exists (gap-nillion-audit-scope); no
      validator/node-base-size or liquidity-retention data exists
      (gap-nillion-network-metrics).
