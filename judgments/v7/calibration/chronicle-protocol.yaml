  - criterionId: observable_scale_vs_capital
    applicability: applicable
    rawAnchor: 50
    coverage: 0.5
    citedEvidenceClaimIds: [clm-chronicle-seed-12m, clm-chronicle-public-launch-2023]
    rationale: >-
      Capital consumed is well-corroborated ($12M seed, March 2025). The
      only candidate scale figure is Chronicle's own September 2023
      launch claim of safeguarding ">$5 billion" for MakerDAO, which is
      self-reported and not independently audited, and predates the 2025
      raise by roughly 18 months, so it cannot cleanly establish today's
      scale-vs-capital ratio. No revenue or current TVL-equivalent figure
      exists (gap-chronicle-revenue).
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      The only scale figure is self-reported and dated (2023); no
      independently audited or current scale metric exists in the frozen
      packet.
