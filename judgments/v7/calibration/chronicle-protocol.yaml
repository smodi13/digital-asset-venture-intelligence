  - criterionId: developer_and_ecosystem_momentum
    applicability: applicable
    rawAnchor: 55
    coverage: 0.5
    citedEvidenceClaimIds: [clm-chronicle-m0-integration]
    rationale: >-
      Chronicle's RWA oracle was integrated with M^0, an independent
      Ethereum-based stablecoin protocol, to validate collateral for its
      $M token (announced August 2024), independently reported by The
      Block. This is one concrete, sourced integration expanding
      Chronicle's footprint beyond its original MakerDAO/Sky relationship,
      though it is a single data point with no broader integration-growth
      trend established.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      Only one additional integration is documented; no data on
      integration cadence, retention, or a broader growth trend exists.
  - criterionId: team_execution_credibility
    applicability: applicable
    rawAnchor: 65
    coverage: 0.5
    citedEvidenceClaimIds: [clm-chronicle-origin, clm-chronicle-public-launch-2023]
    rationale: >-
      Chronicle originated as MakerDAO's Oracle Core Unit and was spun out
      into an independent company after the Maker Foundation dissolved,
      then publicly launched a Scribe oracle product outside the Maker
      ecosystem in September 2023, continuing to serve Sky/MakerDAO. This
      is directly on-point, sourced execution history: the founding team
      built and operated the exact oracle function at MakerDAO before
      independently shipping a launched product in the same domain, which
      is stronger and more specific than a general founder-background
      claim.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      Only one founder (Niklas Kunkel) is named; no broader team
      composition or headcount is established (gap-chronicle-corporate-structure).
