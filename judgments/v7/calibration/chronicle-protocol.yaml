  - criterionId: technical_and_product_differentiation
    applicability: applicable
    rawAnchor: 58
    coverage: 0.5
    citedEvidenceClaimIds: [clm-chronicle-chainsecurity-audit-2023]
    rationale: >-
      An independent ChainSecurity audit of the Scribe mechanism (ahead of
      the September 2023 launch) found three issues, all resolved or
      acknowledged, and concluded the codebase "provides a good level of
      security." This is genuine independent technical assessment, not a
      self-benchmark claim. However, the audit explicitly excluded the
      underlying Schnorr signature-scheme cryptography from scope and does
      not cover current production code (gap-chronicle-audit-scope), so it
      establishes historical code quality rather than present-day
      architectural differentiation from other oracle designs.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      No audit or independent technical assessment covers Chronicle's
      current (post-2023) production code (gap-chronicle-audit-scope).
  - criterionId: defensibility_security_and_network_effects
    applicability: applicable
    rawAnchor: 55
    coverage: 0.5
    citedEvidenceClaimIds: [clm-chronicle-chainsecurity-audit-2023, clm-chronicle-origin, clm-chronicle-public-launch-2023]
    rationale: >-
      Chronicle has a long-standing, independently corroborated service
      relationship with Sky/MakerDAO and a historically scoped independent
      audit with a favorable but bounded conclusion, both consistent with
      some incumbency-based durability. Against this, the same origin
      claim explicitly flags that a material share of Chronicle's
      demonstrated track record depends on one long-standing client
      relationship, a concentration risk rather than a network-effect
      moat, and no claim documents current validator-set size,
      decentralization, or exploit-free history beyond the 2023 audit
      window.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      No current audit coverage, validator-set size, or exploit-history
      evidence exists beyond the 2023 launch window
      (gap-chronicle-audit-scope).
