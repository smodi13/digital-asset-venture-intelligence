criterionJudgments:
  - criterionId: observable_scale_vs_capital
    applicability: applicable
    rawAnchor: 50
    coverage: 0
    citedEvidenceClaimIds: []
    rationale: >-
      No admissible evidence establishes primary capital consumed: the only
      two funding-round leads (a $7M round dated inconsistently by two
      aggregators) carry no disclosed publication date and were excluded as
      non-cutoff-admissible (gap-spheron-funding-rounds-unadmissible), and the
      SPON token launch is a listing event, not company capital raised. Scale
      claims (nodes, compute volume, ARR) are self-reported, low-confidence,
      and internally inconsistent across two disclosures
      (clm-spheron-network-scale-selfreported). With capital unestablished, no
      scale-to-capital ratio can be responsibly judged regardless of scale
      evidence quality.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      Capital consumed is an open research gap
      (gap-spheron-funding-rounds-unadmissible); no admissible financing
      figure exists in the frozen packet.
  - criterionId: operating_resource_intensity
    applicability: applicable
    rawAnchor: 50
    coverage: 0
    citedEvidenceClaimIds: []
    rationale: >-
      No claim in the frozen packet addresses recurring labor, compute
      subsidy, node-operator incentive cost, or infrastructure spend required
      to sustain the compute-marketplace model. The token's stated role in
      compute payment and node-operator rewards is recorded only as
      descriptive research narrative, not as a sourced EvidenceClaim about
      actual subsidy intensity.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      No operating-cost or incentive-subsidy evidence exists in the frozen
      packet.
  - criterionId: adoption_and_usage_momentum
    applicability: applicable
    rawAnchor: 50
    coverage: 0
    citedEvidenceClaimIds: []
    rationale: >-
      The only candidate evidence (node counts, "$100M+ distributed compute,"
      "$10M ARR") is a single-point-in-time, self-reported disclosure with no
      independent corroboration, no stated measurement methodology, and an
      internally conflicting parallel figure set from a separate aggregator
      page (clm-spheron-network-scale-selfreported, evidenceStatus:
      insufficient). A single unverified snapshot does not establish growth
      or persistence, and node count is not usage; no credible momentum
      judgment can rest on it.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      No independently corroborated or time-series usage/momentum evidence
      exists (gap-spheron-arr-figure; gap-spheron-revenue-methodology).
