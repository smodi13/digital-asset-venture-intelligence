  - criterionId: structural_and_regulatory_fit
    applicability: applicable
    rawAnchor: 50
    coverage: 0.5
    citedEvidenceClaimIds: [clm-spheron-legal-entity]
    rationale: >-
      The website Terms of Use names a Singapore-incorporated operating
      entity ("Beta360 Pte Ltd," UEN 202107371K), a concrete jurisdiction
      disclosure. However, whether this entity is the same one that raised
      the 2021-2025 funding rounds attributed to "Spheron"/"Spheron Protocol"
      is unresolved (gap-spheron-legal-entity-vs-fundraising-entity), leaving
      the actual structural/regulatory footing of the fundraising entity
      unclear. A single first-party jurisdiction disclosure with an unresolved
      entity-boundary question does not support a favorable or unfavorable
      lean.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      The relationship between the disclosed operating entity and the
      historical fundraising entity is unresolved
      (gap-spheron-legal-entity-vs-fundraising-entity).
  - criterionId: value_capture_model
    applicability: applicable
    rawAnchor: 45
    coverage: 0.5
    citedEvidenceClaimIds: [clm-spheron-arr-selfreported]
    rationale: >-
      The company self-reports "$10M ARR" but discloses no
      revenue-recognition methodology, so it cannot be distinguished from
      gross marketplace payment volume (which would not represent a company-
      or protocol-side take-rate) versus actual net fee capture
      (evidenceStatus: insufficient). This partial, low-confidence disclosure
      is treated as weak evidence of a possible recurring monetization path
      rather than a confirmed value-capture mechanism.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      Revenue-recognition methodology behind the self-reported ARR figure is
      undisclosed (gap-spheron-revenue-methodology).
