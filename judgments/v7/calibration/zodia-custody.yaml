  - criterionId: structural_and_regulatory_fit
    applicability: applicable
    rawAnchor: 70
    coverage: 1
    citedEvidenceClaimIds: [clm-zodia-founding-jv, clm-zodia-luxembourg-license]
    rationale: >-
      Zodia Custody holds FCA registration in the UK (since 2021) and, as of
      June 2026, both a MiCA CASP license and a Luxembourg CSSF payment
      institution license extending regulated stablecoin custody/transfer
      services across the EU. Multi-jurisdiction regulated status, actively
      expanding rather than static, and backing from a globally systemic
      bank (Standard Chartered) as majority/anchor shareholder, is a
      concrete structural and regulatory-fit strength for an institutional
      custody business specifically.
    acknowledgedContradictionIds: []
    evidenceGapNote: null
