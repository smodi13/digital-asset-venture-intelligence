  - criterionId: defensibility_security_and_network_effects
    applicability: applicable
    rawAnchor: 55
    coverage: 0.5
    citedEvidenceClaimIds: [clm-zodia-luxembourg-license, clm-zodia-staking-launch, clm-zodia-no-known-exploit]
    rationale: >-
      Multi-jurisdiction regulatory licensing (FCA, MiCA, Luxembourg CSSF)
      functions as a real, hard-to-replicate structural moat for a
      regulated custody business, and the staking product carries an ISO
      27001 certification. A targeted search found no security breach
      specifically attributed to Zodia Custody as of the cutoff, but this is
      explicitly an absence-of-evidence finding, not an independent security
      audit or attestation, and is weighted accordingly (evidenceStatus:
      insufficient in the underlying claim). No claim documents client
      switching costs or observed resistance to competitive displacement.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
