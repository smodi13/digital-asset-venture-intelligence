criterionJudgments:
  - criterionId: observable_scale_vs_capital
    applicability: applicable
    rawAnchor: 45
    coverage: 0.5
    citedEvidenceClaimIds: [clm-pixels-seed-round, clm-pixels-strategic-round, clm-pixels-1m-dau-selfreported]
    rationale: >-
      Primary capital consumed is well-corroborated ($2.4M seed plus $4.8M
      strategic, roughly $7.2M cumulative). The only candidate scale figure,
      a self-reported "1 million DAU" claim, is directly undermined by
      independent reporting two weeks later estimating roughly 70% of
      Pixels-linked accounts as bots (clm-pixels-bot-activity); with the
      scale side of the ratio this materially contested, no confident
      favorable or unfavorable scale-to-capital judgment can rest on the raw
      claimed figure.
    acknowledgedContradictionIds: [clm-pixels-bot-activity]
    evidenceGapNote: >-
      The only scale figure is self-reported and materially contested by
      independent bot-activity reporting; no independently verified
      human-user scale metric exists.
  - criterionId: operating_resource_intensity
    applicability: applicable
    rawAnchor: 40
    coverage: 0.5
    citedEvidenceClaimIds: [clm-pixels-fdv-decline]
    rationale: >-
      Following the reported PIXEL FDV decline, Pixels introduced heavier
      withdrawal fees redirected to stakers and automatic in-game staking,
      a real, currently-documented reliance on token-incentive engineering
      to retain player/holder participation, though the source is a single
      independent outlet and the operational scale of these mechanics is
      unverified.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      No compute/infrastructure cost evidence exists; only token-incentive
      mechanics are documented, from a single source.
  - criterionId: adoption_and_usage_momentum
    applicability: applicable
    rawAnchor: 30
    coverage: 1
    citedEvidenceClaimIds: [clm-pixels-1m-dau-selfreported, clm-pixels-bot-activity]
    rationale: >-
      Pixels self-reported surpassing 1 million DAU in May 2024, but
      independent on-chain analytics (ChainArgos) and third-party commentary
      two weeks later estimated roughly 70% of Pixels-linked Ronin accounts
      were bots, with a growth curve "too smooth" for organic activity; the
      company's own developers acknowledged the problem by banning 750,000
      accounts in a single week, though bot activity reportedly rebounded
      afterward. Reported daily-active-account counts are not equated with
      durable human user adoption per this criterion's evidentiary standard;
      the credible, sourced bot-contamination finding materially undercuts
      any claim of real, persisting usage momentum from this period.
    acknowledgedContradictionIds: [clm-pixels-1m-dau-selfreported, clm-pixels-bot-activity]
    evidenceGapNote: null
