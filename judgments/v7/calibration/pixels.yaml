  - criterionId: value_capture_model
    applicability: applicable
    rawAnchor: 50
    coverage: 0.5
    citedEvidenceClaimIds: [clm-pixels-fdv-decline]
    rationale: >-
      A real fee mechanism is documented: new PIXEL withdrawal fees
      redirected to stakers and a new vPIXEL fee-free-withdrawal token,
      introduced alongside a stated pivot from raw DAU toward
      higher-lifetime-value users. This is a genuine, if recent, designed
      fee-redistribution mechanism rather than a pure buyback-and-burn, but
      it directs value to token stakers, not confirmed company-side revenue
      capture, and its methodology and scale are not independently verified
      (single source).
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      The fee mechanism's scale and whether it represents company-side
      capture versus purely token-holder redistribution is not established
      by an independent source.
  - criterionId: economic_sustainability
    applicability: applicable
    rawAnchor: 40
    coverage: 0.5
    citedEvidenceClaimIds: [clm-pixels-fdv-decline]
    rationale: >-
      The PIXEL token is reported to have declined roughly 95% from its
      2024/2025 peak fully diluted valuation, material evidence that the
      original token-incentive economics did not hold. The subsequent
      introduction of withdrawal fees to stakers and a pivot toward
      higher-lifetime-value users is a genuine corrective response, but its
      effectiveness is unconfirmed and the source is a single independent
      outlet.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      The precise peak/trough dates and current effectiveness of the
      economic-model pivot are not independently cross-verified.
