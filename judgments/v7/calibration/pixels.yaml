      rather than denial, though bot activity reportedly rebounded
      afterward, so the response's durability is unconfirmed.
    acknowledgedContradictionIds: [clm-pixels-1m-dau-selfreported]
    evidenceGapNote: >-
      No founder background or prior-track-record evidence exists; the
