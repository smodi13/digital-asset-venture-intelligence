  - criterionId: team_execution_credibility
    applicability: applicable
    rawAnchor: 72
    coverage: 1
    citedEvidenceClaimIds: [clm-superstate-seriesa, clm-superstate-ustb-launch, clm-superstate-transfer-agent]
    rationale: >-
      Robert Leshner's prior company, Compound Labs, is a concrete, widely
      recognized shipped DeFi lending protocol, not mere prestige without
      substance. Under his leadership, Superstate raised two rounds from
      credible institutional investors, shipped two distinct fund
      products (USTB, USCC), and achieved SEC registration of a digital
      transfer-agent subsidiary, a genuinely difficult regulatory
      milestone that independently corroborates real execution capability
      against a hard compliance bar, not just fundraising success.
    acknowledgedContradictionIds: []
    evidenceGapNote: null
  - criterionId: governance_and_incentive_alignment
    applicability: applicable
    rawAnchor: 50
    coverage: 0
    citedEvidenceClaimIds: []
    rationale: >-
      No claim documents Superstate's cap table structure, board control,
      or founder/insider equity concentration. Superstate's asset type is
      equity, not token, so no token-allocation structure exists to
      assess.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      No cap-table, control, or ownership-concentration evidence exists in
      the frozen packet.
  - criterionId: problem_urgency_and_market_depth
    applicability: applicable
    rawAnchor: 55
    coverage: 0.5
    citedEvidenceClaimIds: [clm-superstate-seriesb, clm-superstate-ustb-launch]
    rationale: >-
      A reported $1.2 billion in combined AUM, if accurate, is real
      institutional capital allocated into Superstate's tokenized
      Treasury and basis-trade products, which is direct evidence of
      funded demand distinct from investor conviction in the company
      itself. The figure is company-reported and not independently
      verified, so the anchor is set only modestly above neutral rather
      than crediting the raw scale of the claim.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      The $1.2 billion AUM figure is not independently verified
      (gap-superstate-aum-verification); no per-product or per-customer
      breakdown exists.
  - criterionId: structural_and_regulatory_fit
    applicability: applicable
    rawAnchor: 68
    coverage: 1
    citedEvidenceClaimIds: [clm-superstate-transfer-agent, clm-superstate-sec-engagement]
    rationale: >-
      Superstate Services LLC's SEC transfer-agent registration is a
      confirmed regulatory status, not an aspiration, independently
      reported and consistent with a primary regulatory-record source.
      Superstate also directly engaged the SEC's Crypto Task Force in a
      dated written submission hosted on sec.gov. Together these represent
      concrete, well-corroborated evidence of proactive, favorable-trending
      regulatory positioning in an area (tokenized securities) with an
      otherwise still-evolving regulatory environment; the specific
      substantive content and outcome of the Task Force engagement is not
      established, which keeps the anchor short of the top of the range.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      The specific policy positions advocated in Superstate's SEC letter
      and whether any were adopted were not established.
  - criterionId: value_capture_model
    applicability: applicable
    rawAnchor: 62
    coverage: 1
    citedEvidenceClaimIds: [clm-superstate-ustb-launch]
    rationale: >-
      USTB carries a disclosed 0.15% management fee, a concrete, recurring
      fee mechanism tied to AUM rather than an inferred or aspirational
      revenue model. This is a real, if modest, value-capture mechanism
      consistent with a typical low-margin institutional Treasury product;
      no claim discloses USCC's fee structure or any company-level revenue
      total, which limits how far this can be extended across the whole
      product line.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      No fee or revenue disclosure exists for USCC or at the company level
      beyond USTB's stated management fee.
  - criterionId: economic_sustainability
    applicability: applicable
    rawAnchor: 50
    coverage: 0
    citedEvidenceClaimIds: []
    rationale: >-
      No claim addresses cost structure, burn, or the balance between
      management-fee revenue and operating expense. Two successive equity
      raises establish a financing history but do not by themselves
      establish whether the business is or is not reliant on continued
      external capital versus organic fee revenue.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      No cost-structure or fee-revenue-versus-expense evidence exists in
      the frozen packet.
  - criterionId: distribution_and_integration_pull
    applicability: applicable
    rawAnchor: 55
    coverage: 0.5
    citedEvidenceClaimIds: [clm-superstate-transfer-agent]
    rationale: >-
      Superstate Services LLC's stated plan to extend transfer-agent
      service to other issuers is a genuine B2B distribution-expansion
      path beyond Superstate's own funds, which is structurally distinct
      from simply growing AUM in its own products. No confirmed
      third-party issuer had adopted the service as of the frozen packet,
      so this remains a stated plan rather than realized traction.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      No confirmed third-party issuer adoption of the transfer-agent
      service exists in the frozen packet.
  - criterionId: adoption_friction_and_ecosystem_access
    applicability: applicable
    rawAnchor: 55
    coverage: 0.5
    citedEvidenceClaimIds: [clm-superstate-ustb-launch]
    rationale: >-
      USTB is purchasable and redeemable via USDC, a concrete mechanism
      detail that reduces friction relative to traditional bank-wire fund
      subscription/redemption. The claim also notes access is limited to
      "eligible investors," implying an accreditation/KYC gate whose
      specific requirements and associated friction are not detailed.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      The specific eligible-investor accreditation/KYC requirements and
      associated onboarding time are not detailed in the frozen packet.
  - criterionId: technical_and_product_differentiation
    applicability: applicable
    rawAnchor: 50
    coverage: 0
    citedEvidenceClaimIds: []
    rationale: >-
      No claim provides an independent technical assessment of
      Superstate's tokenization architecture, smart-contract allowlist
      mechanism, or transfer-agent infrastructure versus alternative
      approaches; available evidence is product-description and
      funding/regulatory journalism, not an architecture review.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      No independent technical assessment of Superstate's tokenization or
      transfer-agent architecture exists in the frozen packet.
  - criterionId: defensibility_security_and_network_effects
    applicability: applicable
    rawAnchor: 50
    coverage: 0
    citedEvidenceClaimIds: []
    rationale: >-
      No claim documents switching costs, participant concentration,
      fork/displacement resistance, or exploit history specific to
      Superstate's own smart-contract or custody infrastructure. The SEC
      transfer-agent registration is a genuine regulatory achievement, but
      it is judged under structural_and_regulatory_fit above rather than
      double-counted here, since it does not map to switching-cost,
      network-effect, forkability, or exploit-history evidence for this
      criterion.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      No moat-specific (switching-cost, network-effect, forkability, or
      exploit-history) evidence distinct from the regulatory-registration
      fact exists in the frozen packet.
