criterionJudgments:
  - criterionId: observable_scale_vs_capital
    applicability: applicable
    rawAnchor: 55
    coverage: 0.5
    citedEvidenceClaimIds: [clm-superstate-seriesb]
    rationale: >-
      Total disclosed primary equity capital is $96.5 million ($14M Series
      A plus $82.5M Series B). Against that, Superstate reported combined
      AUM surpassing $1.2 billion across its tokenized products in the
      same announcement that disclosed the Series B. This figure is
      company-reported within its own funding announcement and was not
      independently verified against an on-chain or third-party AUM
      tracker, so it is treated as directionally informative rather than
      a confirmed scale figure, and the anchor is set only modestly above
      neutral rather than crediting the raw ratio.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      The $1.2 billion combined AUM figure is not independently verified
      (gap-superstate-aum-verification).
  - criterionId: operating_resource_intensity
    applicability: applicable
    rawAnchor: 50
    coverage: 0
    citedEvidenceClaimIds: []
    rationale: >-
      No claim addresses headcount, compute, or infrastructure cost for
      operating Superstate's fund products or its transfer-agent
      subsidiary.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      No operating-cost or resource-intensity evidence exists in the
      frozen packet (headcount is also unestablished: gap-superstate-headcount).
  - criterionId: adoption_and_usage_momentum
    applicability: applicable
    rawAnchor: 50
    coverage: 0
    citedEvidenceClaimIds: []
    rationale: >-
      Superstate launched a second product (USCC) after its first
      (USTB), which shows expanding product surface, but no claim
      provides a dated, multi-point series of AUM, subscriber count, or
      transaction volume that would establish usage growing and
      persisting over time; the $1.2 billion AUM figure is a single
      point-in-time, company-reported snapshot, not a growth series.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      No dated multi-period usage or AUM series exists in the frozen
      packet, only a single company-reported snapshot.
  - criterionId: developer_and_ecosystem_momentum
    applicability: applicable
