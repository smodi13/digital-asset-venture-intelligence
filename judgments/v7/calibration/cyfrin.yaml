  - criterionId: team_execution_credibility
    applicability: applicable
    rawAnchor: 55
    coverage: 0.5
    citedEvidenceClaimIds: [clm-cyfrin-founder-patrick-collins, clm-cyfrin-identity-products]
    rationale: >-
      Patrick Collins is independently identifiable as co-founder (GitHub
      profile, a third-party professional-network listing), corroborated
      distinctly from Cyfrin's own "About Us" page, which names different
      individuals in leadership roles that could not be reconciled with
      this attribution. Per the criterion, prior Chainlink Labs affiliation
      alone contributes zero; the anchor instead rests on demonstrated
      delivery: the company built and operates four distinct shipped
      products (CodeHawks, Solodit, Aderyn, Updraft). The unreconciled
      leadership roster and absence of any other named team member limits
      how far this can be credited.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      Cyfrin's own leadership roster (per its About Us page) does not
      reconcile with the independently corroborated founder attribution
      (gap-cyfrin-leadership-roster); no other team member is named or
      sourced.
