  - criterionId: observable_scale_vs_capital
    applicability: applicable
    rawAnchor: 50
    coverage: 0
    citedEvidenceClaimIds: []
    rationale: >-
      No confirmed external funding was found (a single low-confidence
      aggregator characterizes Cyfrin as unfunded), so no capital-consumed
      baseline exists. The self-reported "$100B+ value secured" and
      "$110M advised" figures have no disclosed methodology and are not
      independently corroborated, so no responsible scale-vs-capital ratio
      can be judged.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      No confirmed funding baseline exists (gap-cyfrin-funding); no
      independently corroborated scale metric exists distinct from
      self-reported aggregates.
