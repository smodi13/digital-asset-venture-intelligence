  - criterionId: problem_urgency_and_market_depth
    applicability: applicable
    rawAnchor: 55
    coverage: 0.5
    citedEvidenceClaimIds: [clm-cyfrin-clients-scale]
    rationale: >-
      Cyfrin names specific, recognizable clients (ZKsync, Chainlink,
      Wormhole, Curve) for which Cyfrin-authored audit reports are publicly
      listed in its GitHub audit-reports repository, independently
      corroborating that these named engagements are real rather than
      wholly self-reported. This supports genuine funded demand (protocols
      pay for security audits) for at least a handful of named engagements,
      though the aggregate "$100B+ secured" and "120+ customers" figures
      remain unverified and are not relied on here.
    acknowledgedContradictionIds: []
    evidenceGapNote: >-
      The aggregate customer count and dollar-value figures are
      self-reported with no disclosed methodology and no independent
      corroboration beyond the named clients whose audit reports are
      publicly listed.
